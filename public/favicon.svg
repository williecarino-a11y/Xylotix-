<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Miimiid logo</title>
  <desc id="desc">Dark navy square with the Miimiid M mark and green dot</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#102b4d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#39a8ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55f59b"/>
      <stop offset="1" stop-color="#41a7ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#edge)" stroke-width="8" opacity=".9"/>
  <path d="M124 350V176l86 104 84-104v174" fill="none" stroke="url(#mark)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M294 176v174" fill="none" stroke="#43b9ff" stroke-width="34" stroke-linecap="round"/>
  <circle cx="376" cy="132" r="25" fill="#54ff91" filter="url(#glow)"/>
</svg>
