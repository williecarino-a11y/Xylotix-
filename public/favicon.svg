    <linearGradient id="mCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72F4FF"/>
      <stop offset="45%" stop-color="#16CFF0"/>
      <stop offset="100%" stop-color="#1556E8"/>
    </linearGradient>
    <linearGradient id="mRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19DDF0"/>
      <stop offset="55%" stop-color="#087CF4"/>
      <stop offset="100%" stop-color="#0062FF"/>
