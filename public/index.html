<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xylotix - Financial Academy</title>

  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 15px;
      margin: 0;
      box-sizing: border-box;
    }

    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
    }

    h2 {
      margin-top: 15px;
    }

    h3 {
      margin-top: 0;
      color: #f1f5f9;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-sm {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .hidden {
      display: none !important;
    }

    .success-text {
      color: #4ade80;
      font-weight: bold;
    }

    .error-text {
      color: #f87171;
      font-weight: bold;
    }

    p {
      line-height: 1.5;
      font-size: 0.95rem;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 10px;
    }

    #loading {
      margin: 15px 0;
      color: #38bdf8;
      font-weight: bold;
    }

    #error {
      margin: 15px 0;
      padding: 10px;
      border: 1px solid #7f1d1d;
      border-radius: 5px;
      background: #450a0a;
    }

    .lesson-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lesson-row span {
      flex: 1;
      min-width: 150px;
    }
  </style>
</head>

<body>

  <h1>Xylotix Financial Academy</h1>

  <div id="loading" class="hidden">
    Loading data from database...
  </div>

  <div id="error" class="hidden">
    Something went wrong. Please try again.
  </div>


  <!-- =====================================================
       COURSE LIST VIEW
       ===================================================== -->

  <div id="course-list-view">

    <p>
      Select a course to explore modules and lessons:
    </p>

    <div id="courses-container"></div>

  </div>


  <!-- =====================================================
       COURSE DETAIL VIEW
       ===================================================== -->

  <div id="course-detail-view" class="hidden">

    <button
      class="btn btn-sm"
      onclick="goBackToCourses()"
    >
      ← Back to Courses
    </button>

    <h2
      id="detail-course-title"
      style="color: #38bdf8; margin-top: 15px;"
    ></h2>

    <p id="detail-course-desc"></p>

    <div id="modules-container"></div>

  </div>


  <!-- =====================================================
       INDIVIDUAL LESSON VIEW
       ===================================================== -->

  <div id="lesson-view" class="card hidden">

    <button
      class="btn btn-sm"
      onclick="openCourse(currentCourseId)"
    >
      ← Back to Course Modules
    </button>

    <h2
      id="lesson-title"
      style="color: #38bdf8; margin-top: 15px;"
    ></h2>

    <p id="lesson-content"></p>


    <!-- QUIZ -->

    <div id="quiz-section" class="hidden">

      <h3>Quick Check</h3>

      <p id="quiz-question"></p>

      <div id="quiz-options"></div>

      <button
        class="btn"
        onclick="submitQuiz()"
      >
        Submit Answer
      </button>

      <p id="quiz-result"></p>

    </div>


    <!-- COMPLETE LESSON -->

    <button
      id="complete-btn"
      class="btn"
      onclick="completeLesson()"
    >
      Complete Lesson
    </button>

  </div>


  <script>

    /*
     * =====================================================
     * APPLICATION STATE
     * =====================================================
     */

    let currentCourseId = null;
    let currentLessonId = null;
    let courseDataCache = null;

    /*
     * Temporary user ID used by the current learning system.
     * This can later be replaced with the authenticated user.
     */
    const dummyUserId = "648fc928d566fb4c30676e11";


    /*
     * =====================================================
     * FETCH ALL COURSES
     * =====================================================
     *
     * API:
     * GET /api/learn/courses
     *
     * Backend response:
     *
     * {
     *   status: "success",
     *   data: [...]
     * }
     */

    async function fetchCourses() {

      showLoading(true);
      hideError();

      try {

        const res = await fetch('/api/learn/courses');

        const data = await res.json();

        showLoading(false);

        const container =
          document.getElementById('courses-container');


        /*
         * Backend uses:
         *
         * data.status
         * data.data
         */

        if (
          res.ok &&
          data.status === 'success' &&
          Array.isArray(data.data) &&
          data.data.length > 0
        ) {

          container.innerHTML = data.data.map(course => `

            <div class="card">

              <h3>
                ${escapeHtml(course.title || 'Untitled Course')}
              </h3>

              <p>
                ${escapeHtml(course.description || 'No description available.')}
              </p>

              <button
                class="btn"
                onclick="openCourse('${course._id}')"
              >
                Open Course
              </button>

            </div>

          `).join('');

        } else {

          container.innerHTML = `
            <p>No courses found in database.</p>
          `;

        }

      } catch (err) {

        showLoading(false);

        console.error(
          'Error fetching courses:',
          err
        );

        showError(
          'Unable to load courses. Please try again.'
        );

      }

    }


    /*
     * =====================================================
     * OPEN COURSE
     * =====================================================
     *
     * API:
     * GET /api/learn/courses/:courseId
     *
     * Backend response:
     *
     * {
     *   status: "success",
     *   data: courseData
     * }
     *
     * IMPORTANT:
     *
     * The previous frontend was checking:
     *
     * data.success
     *
     * and:
     *
     * data.course
     *
     * but the backend actually returns:
     *
     * data.status
     * data.data
     *
     * This function now matches the backend.
     */

    async function openCourse(courseId) {

      if (!courseId) {

        showError('Invalid course ID.');

        return;
      }


      currentCourseId = courseId;

      showLoading(true);
      hideError();


      try {

        const res =
          await fetch(`/api/learn/courses/${courseId}`);


        const data =
          await res.json();


        showLoading(false);


        /*
         * Check the actual backend response format.
         */

        if (
          res.ok &&
          data.status === 'success' &&
          data.data
        ) {

          /*
           * Store the complete course tree.
           */

          courseDataCache = data.data;


          /*
           * Switch views.
           */

          document
            .getElementById('course-list-view')
            .classList.add('hidden');

          document
            .getElementById('lesson-view')
            .classList.add('hidden');

          document
            .getElementById('course-detail-view')
            .classList.remove('hidden');


          /*
           * Display course information.
           */

          document
            .getElementById('detail-course-title')
            .innerText =
              courseDataCache.title || 'Untitled Course';


          document
            .getElementById('detail-course-desc')
            .innerText =
              courseDataCache.description ||
              'No description available.';


          /*
           * Get modules.
           */

          const modContainer =
            document.getElementById(
              'modules-container'
            );


          const modules =
            Array.isArray(courseDataCache.modules)
              ? courseDataCache.modules
              : [];


          /*
           * No modules.
           */

          if (modules.length === 0) {

            modContainer.innerHTML = `
              <div class="card">
                <p>
                  No modules are available for this course yet.
                </p>
              </div>
            `;

            return;
          }


          /*
           * Render modules and lessons.
           */

          modContainer.innerHTML =
            modules.map((mod, mIndex) => {

              const lessons =
                Array.isArray(mod.lessons)
                  ? mod.lessons
                  : [];


              return `

                <div class="card">

                  <h3>
                    Module ${mIndex + 1}:
                    ${escapeHtml(
                      mod.title || 'Untitled Module'
                    )}
                  </h3>


                  ${
                    lessons.length > 0

                      ? `

                        <ul>

                          ${lessons.map(les => `

                            <li>

                              <div class="lesson-row">

                                <span>
                                  ${escapeHtml(
                                    les.title ||
                                    'Untitled Lesson'
                                  )}
                                </span>


                                <button
                                  class="btn btn-sm"
                                  onclick="openLesson('${les._id}')"
                                >
                                  Start Lesson
                                </button>

                              </div>

                            </li>

                          `).join('')}

                        </ul>

                      `

                      : `

                        <p>
                          No lessons are available
                          in this module yet.
                        </p>

                      `
                  }

                </div>

              `;

            }).join('');


        } else {

          console.error(
            'Course loading failed:',
            data
          );


          showError(
            data.message ||
            'Unable to load course details.'
          );

        }


      } catch (err) {

        showLoading(false);

        console.error(
          'Error loading course:',
          err
        );


        showError(
          'Unable to connect to the server while loading the course.'
        );

      }

    }


    /*
     * =====================================================
     * OPEN LESSON
     * =====================================================
     */

    function openLesson(lessonId) {

      currentLessonId = lessonId;


      if (
        !courseDataCache ||
        !Array.isArray(courseDataCache.modules)
      ) {

        showError(
          'Course data is not available. Please reopen the course.'
        );

        return;
      }


      let targetLesson = null;


      /*
       * Search every module for the lesson.
       */

      for (
        const mod of courseDataCache.modules
      ) {

        if (!Array.isArray(mod.lessons)) {
          continue;
        }


        const found =
          mod.lessons.find(
            lesson =>
              String(lesson._id) ===
              String(lessonId)
          );


        if (found) {

          targetLesson = found;

          break;
        }

      }


      /*
       * Lesson not found.
       */

      if (!targetLesson) {

        alert('Lesson not found.');

        return;
      }


      /*
       * Switch views.
       */

      document
        .getElementById('course-detail-view')
        .classList.add('hidden');


      document
        .getElementById('lesson-view')
        .classList.remove('hidden');


      /*
       * Reset quiz result.
       */

      document
        .getElementById('quiz-result')
        .innerText = '';


      /*
       * Display lesson.
       */

      document
        .getElementById('lesson-title')
        .innerText =
          targetLesson.title ||
          'Untitled Lesson';


      document
        .getElementById('lesson-content')
        .innerText =
          targetLesson.content ||
          'No lesson content available.';


      /*
       * Handle quiz.
       */

      if (
        targetLesson.quiz &&
        targetLesson.quiz.question
      ) {

        document
          .getElementById('quiz-section')
          .classList.remove('hidden');


        document
          .getElementById('quiz-question')
          .innerText =
            targetLesson.quiz.question;


        const options =
          Array.isArray(targetLesson.quiz.options)
            ? targetLesson.quiz.options
            : [];


        document
          .getElementById('quiz-options')
          .innerHTML =
            options.map((opt, idx) => `

              <label
                style="
                  display:block;
                  margin:8px 0;
                  cursor:pointer;
                "
              >

                <input
                  type="radio"
                  name="quizOpt"
                  value="${idx}"
                >

                ${escapeHtml(opt)}

              </label>

            `).join('');


      } else {

        document
          .getElementById('quiz-section')
          .classList.add('hidden');


        document
          .getElementById('quiz-options')
          .innerHTML = '';

      }

    }


    /*
     * =====================================================
     * SUBMIT QUIZ
     * =====================================================
     *
     * NOTE:
     * The current learningRoutes.js file you showed does
     * not define /api/learn/quiz/submit.
     *
     * Therefore this function handles the response safely,
     * but the backend route may need to be added separately.
     */

    async function submitQuiz() {

      const selected =
        document.querySelector(
          'input[name="quizOpt"]:checked'
        );


      if (!selected) {

        alert(
          'Please select an option.'
        );

        return;
      }


      const selectedOptionIndex =
        parseInt(
          selected.value,
          10
        );


      try {

        const res =
          await fetch(
            '/api/learn/quiz/submit',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                courseId:
                  currentCourseId,

                lessonId:
                  currentLessonId,

                selectedOptionIndex:
                  selectedOptionIndex
              })
            }
          );


        const data =
          await res.json();


        const resultEl =
          document.getElementById(
            'quiz-result'
          );


        if (
          res.ok &&
          (
            data.status === 'success' ||
            data.success === true
          ) &&
          (
            data.isCorrect === true ||
            data.data?.isCorrect === true
          )
        ) {

          resultEl.innerHTML = `
            <span class="success-text">
              Correct! You can now complete the lesson.
            </span>
          `;

        } else {

          resultEl.innerHTML = `
            <span class="error-text">
              ${
                data.message ||
                'Incorrect. Try again!'
              }
            </span>
          `;

        }


      } catch (err) {

        console.error(
          'Quiz submission error:',
          err
        );


        alert(
          'Error validating quiz.'
        );

      }

    }


    /*
     * =====================================================
     * COMPLETE LESSON
     * =====================================================
     *
     * IMPORTANT:
     *
     * Your current backend defines:
     *
     * POST /api/learn/lessons/:lessonId/complete
     *
     * It does NOT define:
     *
     * POST /api/learn/progress/complete
     *
     * So this function now uses the actual backend route.
     */

    async function completeLesson() {

      if (!currentLessonId) {

        alert(
          'No lesson is currently selected.'
        );

        return;
      }


      try {

        const res =
          await fetch(
            `/api/learn/lessons/${currentLessonId}/complete`,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({

                userId:
                  dummyUserId,

                submittedAnswers:
                  []

              })

            }
          );


        const data =
          await res.json();


        if (
          res.ok &&
          data.status === 'success'
        ) {

          const progress =
            data.data?.progressPercentage ??
            data.data?.progress?.progressPercentage;


          if (progress !== undefined) {

            alert(
              `Lesson completed! Course progress: ${progress}%`
            );

          } else {

            alert(
              'Lesson completed successfully!'
            );

          }


          /*
           * Reload the course so the UI reflects
           * the latest database state.
           */

          await openCourse(
            currentCourseId
          );


        } else {

          alert(
            data.message ||
            'Failed to save lesson progress.'
          );

        }


      } catch (err) {

        console.error(
          'Complete lesson error:',
          err
        );


        alert(
          'Failed to save progress.'
        );

      }

    }


    /*
     * =====================================================
     * LOADING STATE
     * =====================================================
     */

    function showLoading(isLoading) {

      const loading =
        document.getElementById('loading');


      if (isLoading) {

        loading.classList.remove(
          'hidden'
        );

      } else {

        loading.classList.add(
          'hidden'
        );

      }

    }


    /*
     * =====================================================
     * ERROR HANDLING
     * =====================================================
     */

    function showError(message) {

      const errorElement =
        document.getElementById('error');


      errorElement.innerText =
        message ||
        'Something went wrong. Please try again.';


      errorElement.classList.remove(
        'hidden'
      );

    }


    function hideError() {

      const errorElement =
        document.getElementById('error');


      errorElement.classList.add(
        'hidden'
      );

    }


    /*
     * =====================================================
     * BACK TO COURSES
     * =====================================================
     */

    function goBackToCourses() {

      document
        .getElementById('course-detail-view')
        .classList.add('hidden');


      document
        .getElementById('course-detail-view')
        .classList.add('hidden');


      document
        .getElementById('lesson-view')
        .classList.add('hidden');


      document
        .getElementById('course-list-view')
        .classList.remove('hidden');


      fetchCourses();

    }


    /*
     * =====================================================
     * BASIC HTML ESCAPING
     * =====================================================
     *
     * Prevents course/lesson text from being interpreted
     * as HTML when inserted into the page.
     */

    function escapeHtml(value) {

      const div =
        document.createElement('div');


      div.textContent =
        value == null
          ? ''
          : String(value);


      return div.innerHTML;

    }


    /*
     * =====================================================
     * START APPLICATION
     * =====================================================
     */

    fetchCourses();

  </script>

</body>
</html>
