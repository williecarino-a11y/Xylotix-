<!DOCTYPE html><html lang="en">
<head>
<script src="/offline-first.js"></script>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/nb-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icons/nb-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a"> 
<link rel="stylesheet" href="/fun-center-hero.css">
<link rel="stylesheet" href="/fun-center-shop.css">
<link rel="stylesheet" href="/learn-layout.css">
<link rel="stylesheet" href="/app-loader.css">
<link rel="stylesheet" href="/splash.css">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Miimiid</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 15px;
      margin: 0;
    }

    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    h2 {
      color: #38bdf8;
      margin-top: 15px;
    }

    h3 {
      color: #f1f5f9;
      margin-top: 0;
    }

    p {
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow-wrap: break-word;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-sm {
      width: auto;
      padding: 7px 12px;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .hidden {
      display: none !important;
    }

    #loading {
      color: #38bdf8;
      font-weight: bold;
      margin: 15px 0;
    }

    #error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
      padding: 12px;
      border-radius: 6px;
      margin: 15px 0;
    }

    .success-text {
      color: #4ade80;
      font-weight: bold;
    }

    .error-text {
      color: #f87171;
      font-weight: bold;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lesson-row span {
      flex: 1;
      min-width: 150px;
    }

    /* ================================
       LESSON HEADER
       ================================ */

    .lesson-meta {
      margin-top: 6px;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
    }

    .lesson-meta-module {
      font-size: 0.9rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .lesson-meta-details {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .lesson-meta-description {
      line-height: 1.6;
      margin: 0;
    }

    /* ================================
       COURSE PROGRESS
       ================================ */

    .course-progress-card {
      margin: 18px 0 24px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .module-progress {
      margin: 8px 0 14px;
      font-size: 13px;
      opacity: 0.75;
    }

    .module-complete {
      font-weight: 600;
    }

    .lesson-row.completed {
      opacity: 0.9;
    }

    .lesson-completed {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-right: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .course-progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .course-progress-header strong {
      font-size: 16px;
    }

    #course-progress-percent {
      font-weight: bold;
    }

    .course-progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
    }

    .course-progress-bar {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
      background: #38bdf8;
    }

    #course-progress-text {
      margin: 10px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }

    /* ================================
       LESSON CONTENT
       ================================ */

    #lesson-content {
      margin-top: 20px;
    }

    .content-block {
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .content-heading {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .content-text {
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .content-example {
      background: #172554;
      border-left: 4px solid #38bdf8;
      padding: 14px;
      border-radius: 6px;
    }

    .content-callout {
      background: #422006;
      border-left: 4px solid #f59e0b;
      padding: 14px;
      border-radius: 6px;
    }

    .content-formula {
      background: #020617;
      padding: 14px;
      border-radius: 6px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .content-summary {
      background: #052e16;
      border-left: 4px solid #4ade80;
      padding: 14px;
      border-radius: 6px;
    }

    .content-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
    }

.content-video {
  display: block;
  width: 100%;
  max-width: 800px;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 10px;
  margin: 15px auto 0;
  background: #000;
}

.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.video-watermark {
  position: absolute;
  bottom: 12px;
  right: 12px;

  color: rgba(255, 255, 255, 0.75);
  font-size: 14px;
  font-weight: 600;

  padding: 5px 8px;
  border-radius: 4px;

  background: rgba(0, 0, 0, 0.35);

  pointer-events: none;
  user-select: none;

  z-index: 2;
}

    .content-caption {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* ================================
       QUIZ
       ================================ */

    .quiz-option {
      display: block;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .quiz-option:hover {
      border-color: #38bdf8;
    }

    .quiz-option input {
      margin-right: 8px;
    }

/* ================================
   CALCULATION ANSWER INPUT
   ================================ */

.calculation-input {
  width: 100%;
  padding: 14px 16px;
  margin-top: 10px;

  background: #ffffff;
  color: #111827;

  border: 2px solid #cbd5e1;
  border-radius: 8px;

  font-size: 16px;
  font-weight: 500;

  box-sizing: border-box;
  outline: none;
}

.calculation-input:focus {
  background: #ffffff;
  color: #111827;
  border-color: #2563eb;
}

.calculation-input::placeholder {
  color: #64748b;
  opacity: 1;
}

  /* ================================
     MIIMIID HEADER + LANGUAGE SELECTOR
     ================================ */

  .miimiid-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  .miimiid-brand {
    margin: 0;
    color: #38bdf8;
    font-size: 1.5rem;
    line-height: 1.2;
  }

  .language-selector {
    position: relative;
  }

  .language-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .language-toggle:hover,
  .language-toggle:focus-visible {
    border-color: #38bdf8;
    background: #263449;
    outline: none;
  }

  .language-toggle-icon {
    font-size: 1rem;
  }

  .language-chevron {
    font-size: 0.75rem;
    transition: transform 0.2s;
  }

  .language-selector.open .language-chevron {
    transform: rotate(180deg);
  }

  .language-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 230px;
    max-height: 360px;
    overflow-y: auto;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    z-index: 1000;
  }

  .language-menu.hidden {
    display: none;
  }

  .language-option {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: transparent;
    color: #f8fafc;
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    cursor: pointer;
    text-align: left;
    font-size: 0.9rem;
  }

  .language-option:hover,
  .language-option:focus-visible {
    background: #334155;
    outline: none;
  }

  .language-option.active {
    background: #0c4a6e;
    color: #7dd3fc;
  }

  .language-option-name {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .language-option-native {
    color: #94a3b8;
    font-size: 0.78rem;
  }

  .language-option.active .language-option-native {
    color: #bae6fd;
  }

  .language-check {
    font-weight: bold;
    color: #4ade80;
  }

  @media (max-width: 520px) {
    .miimiid-header {
      align-items: flex-start;
    }

    .language-toggle {
      padding: 8px 10px;
    }

    .language-toggle-label {
      display: none;
    }

    .language-menu {
      width: min(230px, calc(100vw - 30px));
    }
  }


/* =========================================================
   MIIMIID APP SHELL — DYNAMIC HOME DASHBOARD
   ========================================================= */

.miimiid-app-shell {
  min-height: 100vh;
  padding-bottom: 82px;
}

.miimiid-dashboard {
  display: none;
}

.miimiid-dashboard.active {
  display: block;
}

.miimiid-dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}

.miimiid-dashboard-menu {
  position: static;
}

.miimiid-menu-toggle {
  position: relative;
  z-index: 1250;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 46px;
  height: 46px;
  padding: 0;

  border: 0;
  border-radius: 12px;

  background: transparent;
  color: #f8fafc;

  cursor: pointer;
  font-size: 28px;
  line-height: 1;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.miimiid-menu-toggle:hover,
.miimiid-menu-toggle:focus-visible {
  background: #1e293b;
  outline: none;
}

.miimiid-menu-toggle:active {
  transform: scale(0.94);
}

.miimiid-dashboard-brand {
  margin: 0;
}

.miimiid-dashboard-content {
  display: grid;
  gap: 18px;
}

.miimiid-dashboard-stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.miimiid-dashboard-stat {
  min-width: 0;
  padding: 18px;
  border: 1px solid #334155;
  border-radius: 16px;
  background: #1e293b;
}

.miimiid-dashboard-stat-value {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 800;
  color: #f8fafc;
}

.miimiid-dashboard-stat-label {
  margin: 6px 0 0;
  color: #94a3b8;
  font-size: 0.85rem;
}



/*
 * MIIMIID DRAWER LANGUAGE SELECTOR
 *
 * The language selector is a drawer item, never a header item.
 */
.miimiid-drawer-language-slot {
  flex: 0 0 auto;
  width: 100%;
  margin-bottom: 8px;
}

.miimiid-drawer-language-slot .language-selector {
  width: 100%;
}

.miimiid-drawer-language-slot .language-toggle {
  width: 100%;
  justify-content: flex-start;
  min-height: 54px;
  padding: 14px 16px;
  border-radius: 12px;
}

.miimiid-drawer-language-slot .language-toggle-label {
  display: inline;
}

.miimiid-drawer-language-slot .language-menu {
  position: relative;
  width: 100%;
  max-width: none;
  margin-top: 6px;
}


/* =========================================================
   MIIMIID LEFT NAVIGATION DRAWER
   ========================================================= */

.miimiid-dashboard-menu-panel {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;

  z-index: 1200;

  width: min(320px, 86vw);
  max-width: 320px;

  display: flex;
  flex-direction: column;
  gap: 4px;

  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));

  overflow-y: auto;
  overscroll-behavior: contain;

  background: #0f172a;
  border-right: 1px solid #334155;

  box-shadow:
    18px 0 50px rgba(0, 0, 0, 0.35);

  transform: translateX(-105%);
  visibility: hidden;

  transition:
    transform 0.25s ease,
    visibility 0s linear 0.25s;
}

.miimiid-dashboard-menu.open
.miimiid-dashboard-menu-panel {
  transform: translateX(0);
  visibility: visible;

  transition:
    transform 0.25s ease,
    visibility 0s linear 0s;
}


/* =========================================================
   DRAWER BACKDROP
   ========================================================= */

.miimiid-drawer-backdrop {
  position: fixed;
  inset: 0;

  z-index: 1150;

  background: rgba(0, 0, 0, 0.52);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.25s ease,
    visibility 0s linear 0.25s;
}

body.miimiid-drawer-open
.miimiid-drawer-backdrop {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transition:
    opacity 0.25s ease,
    visibility 0s linear 0s;
}

body.miimiid-drawer-open {
  overflow: hidden;
}


/* =========================================================
   DRAWER ITEMS
   ========================================================= */

.miimiid-dashboard-menu-item {
  flex: 0 0 auto;

  width: 100%;
  min-height: 54px;

  display: flex;
  align-items: center;

  border: 0;
  border-radius: 12px;

  padding: 14px 16px;

  background: transparent;
  color: #f8fafc;

  text-align: left;
  cursor: pointer;

  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;

  transition:
    background 0.18s ease,
    transform 0.18s ease;
}

.miimiid-dashboard-menu-item:hover,
.miimiid-dashboard-menu-item:focus-visible {
  background: #1e293b;
  outline: none;
}

.miimiid-dashboard-menu-item:active {
  transform: scale(0.985);
}

.miimiid-bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1050;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px;
  border-top: 1px solid #334155;
  background: #0f172a;
}

.miimiid-bottom-nav button {
  min-width: 0;
  padding: 9px 5px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 0.78rem;
}

.miimiid-bottom-nav button.active,
.miimiid-bottom-nav button:hover,
.miimiid-bottom-nav button:focus-visible {
  background: #1e293b;
  color: #f8fafc;
  outline: none;
}

.miimiid-dashboard-status {
  display: none;
}

@media (min-width: 640px) {
  .miimiid-dashboard-stat-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 768px) {
  .miimiid-bottom-nav {
    left: 50%;
    right: auto;
    width: min(680px, calc(100vw - 32px));
    transform: translateX(-50%);
    border: 1px solid #334155;
    border-bottom: 0;
    border-radius: 14px 14px 0 0;
  }
}
    
    /* =========================================
       MIIMIID AUTHENTICATION
       ========================================= */

    .miimiid-auth-view {
      width: calc(100% + 30px);
      min-height: calc(100vh + 30px);
      min-height: calc(100dvh + 30px);
      margin: -15px;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      box-sizing: border-box;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .miimiid-auth-card {
      width: 100%;
      max-width: 520px;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /*
     * Authentication viewport safety:
     * Keep long registration/authentication states reachable
     * when the viewport becomes shorter because of the keyboard.
     */
    .miimiid-auth-view {
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .miimiid-auth-card {
      min-height: 100%;
    }

    .miimiid-auth-card h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .miimiid-auth-card p {
      opacity: 0.85;
    }

    .miimiid-auth-form {
      margin-top: 20px;
    }

    .miimiid-auth-field {
      margin-bottom: 15px;
    }

    .miimiid-auth-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .miimiid-auth-field input {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }

    .miimiid-auth-field input:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
    }

    .miimiid-auth-password-wrap {
      position: relative;
      width: 100%;
    }

    .miimiid-auth-password-wrap input {
      padding-right: 46px;
      box-sizing: border-box;
    }

    .miimiid-password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 6px;
      line-height: 1;
    }

    .miimiid-password-toggle:hover {
      color: #f8fafc;
      background: rgba(148, 163, 184, 0.12);
    }

    .miimiid-password-toggle:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
    }

    .miimiid-password-toggle svg {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .miimiid-auth-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .miimiid-auth-link {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      padding: 9px 0;
      font-size: 1rem;
      font-weight: bold;
    }

    .miimiid-auth-link:hover {
      text-decoration: underline;
    }

    .miimiid-auth-status {
      min-height: 22px;
      margin-top: 14px;
    }

    .miimiid-auth-loading {
      text-align: center;
      padding: 50px 20px;
      color: #38bdf8;
      font-weight: bold;
    }

    .miimiid-auth-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .miimiid-auth-user-name {
      font-weight: bold;
    }

    .miimiid-logout-btn {
      width: auto;
      margin-top: 0;
    }


    /* =========================================
       MIIMIID REGISTRATION — RESTORED UI
       ========================================= */

    .miimiid-register-step {
      width: 100%;
      box-sizing: border-box;
    }

    .miimiid-register-step.hidden {
      display: none !important;
    }

    .miimiid-register-welcome {
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      padding: 32px 20px 24px;
    }

    .miimiid-register-welcome h2 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .miimiid-register-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 auto 24px;
    }

    .miimiid-register-visual-icon {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 32px;
      font-size: 4rem;
      line-height: 1;
      background: rgba(56, 189, 248, 0.10);
      border: 1px solid rgba(56, 189, 248, 0.20);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);

    /*
     * MIIMIID REUSABLE PRIMARY ASYNC ACTION BUTTON
     *
     * Central loading presentation used by real asynchronous
     * application/authentication operations.
     *
     * The button itself keeps its existing dimensions.
     * Only its content presentation changes while the real
     * Promise returned by the action is pending.
     */
    .miimiid-async-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .miimiid-async-button[aria-busy="true"] {
      pointer-events: none;
      cursor: wait;
    }

    .miimiid-async-button-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      visibility: visible;
      opacity: 1;
    }

      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      border: 3px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      display: block;
      margin: -10px 0 0 -10px;

      opacity: 0;

      animation: miimiidAsyncButtonSpin 0.75s linear infinite;
      animation-play-state: paused;
      transform: rotate(0deg);
      pointer-events: none;
    }

    .miimiid-async-button[aria-busy="true"]

  <script>
(function () {
  // Error banners only show when the address ends with ?debug=1
  var debug = /[?&]debug=1\b/.test(location.search);

  function banner(color, text) {
    if (!debug) return;
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:' + color + ';color:white;padding:10px;font-size:12px;white-space:pre-wrap;';
    el.textContent = text;
    document.body.appendChild(el);
  }

  window.addEventListener('error', function (e) {
    console.error('JS ERROR:', e.message, (e.filename || '') + ':' + e.lineno);
    banner('red', 'JS ERROR: ' + e.message + ' at ' + (e.filename || '') + ':' + e.lineno);
  });

  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    var msg = reason && reason.message ? reason.message : String(reason);
    var stack = reason && reason.stack ? reason.stack : '';
    console.error('PROMISE ERROR:', msg);
    banner('purple', 'PROMISE ERROR: ' + msg + '\n' + stack);
  });
})();
  </script>

  </div>  <script>


    /* =========================================
       MIIMIID DYNAMIC APP DASHBOARD

    let miimiidDashboardData = null;
    let miimiidActiveView = "home";

    const MIIMIID_DASHBOARD_NAV = [
      {
        id: "home",
        key: "home"
      },
      {
        id: "learn",
        key: "learn"
      },
      {
        id: "funCenter",
        key: "funCenter"
      },
      {
        id: "aiTutor",
        key: "aiTutor"
      }
    ];

    /*
     * MIIMIID SECONDARY DRAWER REGISTRY
     *
     * Only genuinely implemented secondary/account
     * destinations may be registered here.
     *
     * Do not add planned, placeholder, or fabricated
     * destinations. The primary navigation remains
     * Home / Learn / Fun Center / AI Tutor.
     */
    const MIIMIID_DRAWER_ITEMS = [];

    window.MIIMIID_DRAWER_ITEMS = MIIMIID_DRAWER_ITEMS;

    const MIIMIID_DASHBOARD_STATS = [
      {
        id: "xp",
        value: data => data.totalXP,
        key: "xp"
      },
      {
        id: "streak",
        value: data => data.streak,
        key: "streak"
      },
      {
        id: "lessons",
        value: data => data.totalLessonsCompleted,
        key: "lessonsCompleted"
      },
      {
        id: "score",
        value: data => `${data.averageQuizScore}%`,
        key: "averageQuizScore"
      }
    ];

    function miimiidDashboardTranslate(key) {
      if (
        !key ||
        typeof miimiidTranslate !== "function"
      ) {
        return "";
      }

      const language =
        typeof getSavedLanguage === "function"
          ? getSavedLanguage()
          : "en";

      const translated =
        miimiidTranslate(
          key,
          language
        );

      /*
       * Never allow an internal translation identifier
       * to become visible UI.
       *
       * If the selected language does not contain the key,
       * resolve against the canonical English translation data.
       */
      if (
        typeof translated === "string" &&
        translated.trim() &&
        translated.trim() !== key
      ) {
        return translated;
      }

      if (language !== "en") {
        const english =
          miimiidTranslate(
            key,
            "en"
          );

        if (
          typeof english === "string" &&
          english.trim() &&
          english.trim() !== key
        ) {
          return english;
        }
      }

      /*
       * Empty is safer than leaking an internal database/
       * translation identifier into production UI.
       */
      return "";
    }

    function renderMiimiidBottomNavigation() {
      const nav =
        document.getElementById("miimiid-bottom-nav");

      if (!nav) {
        return;
      }

      nav.innerHTML =
        MIIMIID_DASHBOARD_NAV
          .map(item => `
            <button
              type="button"
              data-dashboard-view="${item.id}"
              class="${miimiidActiveView === item.id ? "active" : ""}"
              aria-current="${miimiidActiveView === item.id ? "page" : "false"}"
            >
              ${miimiidDashboardTranslate(item.key)}
            </button>
          `)
          .join("");

      nav.querySelectorAll("[data-dashboard-view]")
        .forEach(button => {
          button.addEventListener("click", () => {
            miimiidNavigate(button.dataset.dashboardView);
          });
        });

    }

    function renderMiimiidDashboard() {
      const dashboard =
        document.getElementById("miimiid-dashboard");

      if (!dashboard || !miimiidDashboardData) {
        return;
      }

      const data = miimiidDashboardData;

      dashboard.innerHTML = `
        <div class="miimiid-dashboard-header">
          <h1 class="miimiid-dashboard-brand">
            ${miimiidDashboardTranslate("home")}
          </h1>

          <div class="miimiid-auth-user">
            <span class="miimiid-auth-user-name">
              ${escapeHtml(
                miimiidCurrentUser &&
                miimiidCurrentUser.name
                  ? miimiidCurrentUser.name
                  : ""
              )}
            </span>

            <button
              type="button"
              class="btn btn-sm miimiid-logout-btn"
              id="miimiid-logout-btn"
            >
              Sign Out
            </button>
          </div>

        </div>

        <div class="miimiid-dashboard-content">
          <div class="miimiid-dashboard-stat-grid">
            ${MIIMIID_DASHBOARD_STATS.map(stat => `
              <button
                type="button"
                class="miimiid-dashboard-stat"
                data-dashboard-stat="${stat.id}"
                aria-label="${miimiidDashboardTranslate(stat.key)}"
              >
                <span class="miimiid-dashboard-stat-value">
                  ${stat.value(data)}
                </span>
                <span class="miimiid-dashboard-stat-label">
                  ${miimiidDashboardTranslate(stat.key)}
                </span>
              </button>
            `).join("")}
          </div>
        </div>
      `;

      renderMiimiidDashboardMenu();
      bindMiimiidDashboardMenu();
      bindMiimiidDashboardStats();

      const logoutButton =
        document.getElementById(
          "miimiid-logout-btn"
        );

      if (
        logoutButton &&
        logoutButton.dataset.bound !== "true"
      ) {
        logoutButton.dataset.bound = "true";

        logoutButton.addEventListener(
          "click",
          logoutMiimiid
        );
      }
    }

    function renderMiimiidDashboardMenu() {
      const panel =
        document.getElementById(
          "miimiid-dashboard-menu-panel"
        );

      if (!panel) {
        return;
      }

      const menuItems =
        Array.isArray(window.MIIMIID_DRAWER_ITEMS)
          ? window.MIIMIID_DRAWER_ITEMS
          : [];

      panel.innerHTML = menuItems
        .filter(item =>
          item &&
          typeof item.key === "string" &&
          typeof item.id === "string"
        )
        .map(item => `
          <button
            type="button"
            class="miimiid-dashboard-menu-item"
            data-menu-key="${item.id}"
          >
            ${miimiidDashboardTranslate(item.key)}
          </button>
        `)
        .join("");
    }

    function bindMiimiidDashboardMenu() {
      const menu =
        document.getElementById(
          "miimiid-dashboard-menu"
        );

      const toggle =
        document.getElementById(
          "miimiid-menu-toggle"
        );

      const backdrop =
        document.getElementById(
          "miimiid-drawer-backdrop"
        );

      if (!menu || !toggle || !backdrop) {
        return;
      }

      /*
       * Dashboard rendering can happen more than once.
       * Bind the persistent drawer controls only once.
       */
      if (toggle.dataset.bound === "true") {
        return;
      }

      toggle.dataset.bound = "true";

      const closeMenu = () => {
        menu.classList.remove("open");

        toggle.setAttribute(
          "aria-expanded",
          "false"
        );

        backdrop.setAttribute(
          "aria-hidden",
          "true"
        );

        document.body.classList.remove(
          "miimiid-drawer-open"
        );
      };

      const openMenu = () => {
        menu.classList.add("open");

        toggle.setAttribute(
          "aria-expanded",
          "true"
        );

        backdrop.setAttribute(
          "aria-hidden",
          "false"
        );

        document.body.classList.add(
          "miimiid-drawer-open"
        );
      };

      toggle.addEventListener(
        "click",
        event => {
          event.stopPropagation();

          if (menu.classList.contains("open")) {
            closeMenu();
          } else {
            openMenu();
          }
        }
      );

      backdrop.addEventListener(
        "click",
        closeMenu
      );

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            menu.classList.contains("open")
          ) {
            closeMenu();
          }
        }
      );

      menu.addEventListener(
        "click",
        event => {
          const item =
            event.target.closest(
              ".miimiid-dashboard-menu-item"
            );

          if (!item) {
            return;
          }

          const menuId =
            item.dataset.menuKey;

          const drawerItem =
            window.MIIMIID_DRAWER_ITEMS.find(
              entry => entry.id === menuId
            );

          closeMenu();

          if (
            drawerItem &&
            typeof drawerItem.action === "function"
          ) {
            drawerItem.action();
          }
        }
      );
    }

    async function initializeMiimiidDashboard() {
      /*
       * Authentication boundary:
       *
       * The application shell is exposed only after a real
       * authenticated user exists AND the initial dashboard
       * view has successfully initialized.
       */
      const userId =
        getMiimiidCurrentUserId();

      if (!userId) {
        showMiimiidAuthView();
        return false;
      }

      try {
        renderMiimiidBottomNavigation();

        const dashboardReady =
          await miimiidNavigate("home");

        /*
         * Never expose the authenticated application merely
         * because authentication succeeded. The dashboard
         * itself must report successful initialization.
         */
        if (dashboardReady !== true) {
          throw new Error(
            "Miimiid dashboard initialization did not complete successfully."
          );
        }

        /*
         * Dashboard initialization completed successfully.
         * This is the single controlled point where the
         * authenticated application becomes visible.
         */
        hideMiimiidAuthView();

        return true;

      } catch (error) {
        console.error(
          "Miimiid dashboard initialization error:",
          error
        );

        /*
         * Never leave the application between auth and
         * dashboard states.
         */
        showMiimiidAuthView();

        setMiimiidAuthStatus(
          miimiidSafeAuthMessage(
            "authDashboardLoadError",
            "We couldn't load your account right now. Please try again."
          ),
          "error"
        );

        return false;
      }
    }

    async function loadMiimiidDashboard() {
      const dashboard =
        document.getElementById(
          "miimiid-dashboard"
        );

      if (!dashboard) {
        console.error(
          "Miimiid dashboard loading error: dashboard element is missing."
        );

        miimiidDashboardData = null;
        return false;
      }

      try {
        const userId =
          getMiimiidCurrentUserId();

        if (!userId) {
          console.warn(
            "Miimiid dashboard: no authenticated user ID is available."
          );

          miimiidDashboardData = null;
          return false;
        }

        const response =
          await miimiidFetchWithTimeout(
            `/api/learn/dashboard/${encodeURIComponent(userId)}`,
            {
              method: "GET",
              credentials: "same-origin",
              headers: {
                "Accept": "application/json"
              }
            },
            15000
          );

        if (!response.ok) {
          throw new Error(
            `Dashboard request failed: ${response.status}`
          );
        }

        const result =
          await response.json();

        if (
          !result ||
          result.status !== "success" ||
          !result.data
        ) {
          throw new Error(
            "Dashboard response was invalid."
          );
        }

        miimiidDashboardData =
          result.data;

        renderMiimiidDashboard();

        /*
         * A successful dashboard initialization must be
         * explicitly observable by the authentication boundary.
         */
        return true;

      } catch (error) {
        console.error(
          "Miimiid dashboard loading error:",
          error
        );

        /*
         * Do not manufacture a successful dashboard state.
         *
         * Authentication may have succeeded, but the
         * authenticated application is not ready until the
         * real dashboard request and rendering complete.
         */
        miimiidDashboardData = null;

        return false;
      }
    }

    function miimiidSetLearningViewVisible(visible) {
      const courseList =
        document.getElementById(
          "course-list-view"
        );

      const courseDetail =
        document.getElementById(
          "course-detail-view"
        );

      const lessonView =
        document.getElementById(
          "lesson-view"
        );

      if (courseList) {
        courseList.classList.toggle(
          "hidden",
          !visible || (
            currentCourseId &&
            courseDetail &&
            !courseDetail.classList.contains("hidden")
          )
        );
      }

      if (!visible) {
        if (courseDetail) {
          courseDetail.classList.add("hidden");
        }

        if (lessonView) {
          lessonView.classList.add("hidden");
        }
      }
    }

    function bindMiimiidDashboardStats() {
      const dashboard =
        document.getElementById("miimiid-dashboard");

      if (!dashboard) {
        return;
      }

      dashboard
        .querySelectorAll("[data-dashboard-stat]")
        .forEach(stat => {
          stat.addEventListener("click", () => {
            miimiidHandleStatClick(
              stat.dataset.dashboardStat
            );
          });
        });
    }

    function miimiidHandleStatClick(stat) {
      if (!miimiidDashboardData) {
        return;
      }

      switch (stat) {
        case "lessonsCompleted":
        case "averageQuizScore":
          miimiidNavigate("learn");
          return;

        case "xp":
        case "streak":
          miimiidNavigate("home");
          return;

        default:
          return;
      }
    }

    async function miimiidNavigate(view) {
      miimiidActiveView = view;

      const dashboard =
        document.getElementById(
          "miimiid-dashboard"
        );

      if (view === "home") {
        miimiidSetLearningViewVisible(false);

        const funCenterView =
          document.getElementById(
            "miimiid-fun-center-view"
          );

        if (funCenterView) {
          funCenterView.classList.add("hidden");
        }

        if (dashboard) {
          dashboard.classList.add("active");
        }

        renderMiimiidBottomNavigation();

        /*
         * Propagate real dashboard readiness to the
         * authentication/application boundary.
         */
        return await loadMiimiidDashboard();
      }

      if (dashboard) {
        dashboard.classList.remove("active");
      }

      if (view === "funCenter") {
        miimiidSetLearningViewVisible(false);

        const courseList =
          document.getElementById(
            "course-list-view"
          );

        const courseDetail =
          document.getElementById(
            "course-detail-view"
          );

        const lessonView =
          document.getElementById(
            "lesson-view"
          );

        const aiTutorView =
          document.getElementById(
            "miimiid-ai-tutor-view"
          );

        if (courseList) {
          courseList.classList.add("hidden");
        }

        if (courseDetail) {
          courseDetail.classList.add("hidden");
        }

        if (lessonView) {
          lessonView.classList.add("hidden");
        }

        if (aiTutorView) {
          aiTutorView.classList.add("hidden");
        }

        const funCenterView =
          document.getElementById(
            "miimiid-fun-center-view"
          );

        if (funCenterView) {
          funCenterView.classList.remove("hidden");
        }

        renderMiimiidBottomNavigation();
        await loadMiimiidFunCenter();
        return;
      }

      if (view === "learn") {

    async function loadMiimiidCurrentUser() {
      try {
        const response =
          await fetch(
            "/api/auth/me",
            {
              method: "GET",
              credentials: "same-origin",
              headers: {
                "Accept": "application/json"
              }
            }
          );

        if (response.status >= 500) {
          throw new Error("Miimiid server unavailable.");
        }

        if (!response.ok) {
          miimiidCurrentUser = null;
          return null;
        }

        const result =
          await response.json();

        if (
          result &&
          result.status === "success" &&
          result.data &&
          result.data.user
        ) {
          miimiidCurrentUser =
            result.data.user;

          window.currentUser =
            miimiidCurrentUser;

          window.MIIMIID_CURRENT_USER =
            miimiidCurrentUser;

          return miimiidCurrentUser;
        }

        miimiidCurrentUser = null;
        return null;

      } catch (error) {
        console.error(
          "Miimiid authentication check failed:",
          error
        );

        // The user is not signed out: the app just could not reach the server
        const connectionError =
          new Error("Unable to reach Miimiid.");

        connectionError.connectionProblem = true;
        throw connectionError;
      }
    }

    function getMiimiidCurrentUserId() {
      const candidates = [
        miimiidCurrentUser,
        window.currentUser,
        window.MIIMIID_CURRENT_USER,
        window.loggedInUser,
        window.user
      ];

      for (const user of candidates) {
        if (
          user &&
          typeof user.id === "string" &&
          /^[a-fA-F0-9]{24}$/.test(user.id)
        ) {
          return user.id;
        }

        if (
          user &&
          typeof user._id === "string" &&
          /^[a-fA-F0-9]{24}$/.test(user._id)
        ) {
          return user._id;
        }
      }

      return null;
    }


    /*
     * Abort a network request that remains pending indefinitely.
     * Authentication/dashboard transitions must always resolve.
     */
    async function miimiidFetchWithTimeout(
      url,
      options = {},
      timeoutMs = 15000
    ) {
      const controller =
        new AbortController();

      const timeout =
        window.setTimeout(
          () => controller.abort(),
          timeoutMs
        );

      try {
        return await fetch(
          url,
          {
            ...options,
            signal: controller.signal
          }
        );
      } finally {
        window.clearTimeout(timeout);
      }
    }


    /*
     * MIIMIID AUTH VALIDATION HELPERS
     *
     * Never expose raw backend/internal translation keys
     * directly to the user interface.
     */
    function miimiidSafeAuthMessage(
      key,
      fallback
    ) {
      try {
        const translated =
          typeof miimiidDashboardTranslate === "function"
            ? miimiidDashboardTranslate(key)
            : "";

        if (
          translated &&
          translated !== key &&
          !/^auth[A-Z]/.test(translated)
        ) {
          return translated;
        }
      } catch (error) {
        console.warn(
          "Miimiid translation lookup failed:",
          error
        );
      }

      return fallback;
    }

    function miimiidNormalizeAuthenticationError(
      error,
      fallback
    ) {
      const raw =
        error &&
        typeof error.message === "string"
          ? error.message.trim()
          : "";

      if (!raw) {
        return fallback;
      }

      /*
       * Never expose internal translation keys,
       * technical backend errors, or stack-like messages.
       */
      if (
        /^auth[A-Z]/.test(raw) ||
        /^Error:/i.test(raw) ||
        /ECONN|ETIMEDOUT|ENOTFOUND|Mongo|Mongoose|ValidationError|CastError/i.test(raw)
      ) {
        return fallback;
      }

      return raw;
    }

    function miimiidValidateBirthday() {
      const hiddenDob =
        document.getElementById(
          "miimiid-register-dob"
        );

      const picker =
        document.getElementById(
          "miimiid-birthday-picker-modal"
        );

      const value =
        hiddenDob?.value || "";

      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(value) ||
        !picker ||
        picker.dataset.dobValid !== "true"
      ) {
        return false;
      }

      const [
        year,
        month,
        day
      ] = value.split("-").map(Number);

      const selected =
        new Date(
          year,
          month - 1,
          day
        );

      const today =
        new Date();

      const maximum =
        new Date(
          today.getFullYear() - 18,
          today.getMonth(),
          today.getDate()
        );

      return (
        selected.getFullYear() === year &&
        selected.getMonth() === month - 1 &&
        selected.getDate() === day &&
        selected <= maximum
      );
    }

    function miimiidValidatePassword() {
      const password =
        document.getElementById(
          "miimiid-register-password"

      return password.length >= 8;

    function miimiidValidateConfirmPassword() {
      const password =
        document.getElementById(
          "miimiid-register-password"
        )?.value || "";

      const confirm =
        document.getElementById(
          "miimiid-register-confirm"
        )?.value || "";

      return (
        confirm.length >= 8 &&
        password === confirm
      );
    }

    function initializeMiimiidRegistrationValidation() {
      const password =
        document.getElementById(
          "miimiid-register-password"
        );

      const confirm =
        document.getElementById(
          "miimiid-register-confirm"
        );

      const birthday =
        document.getElementById(
          "miimiid-register-birthday-trigger"
        );

      if (!password || !confirm) {
        return;
      }

      const validateLive = () => {
        const value =
          password.value || "";

        const confirmValue =
          confirm.value || "";

        password.setCustomValidity(
          value.length > 0 &&
          value.length < 8
            ? miimiidSafeAuthMessage(
                "authPasswordMinLength",
                "Password must be at least 8 characters."
              )
            : ""
        );

        if (
          confirmValue.length > 0 &&
          value !== confirmValue
        ) {
          confirm.setCustomValidity(
            miimiidSafeAuthMessage(
              "authPasswordMismatch",
              "Passwords do not match."
            )
          );
        } else {
          confirm.setCustomValidity("");
        }
      };

      password.addEventListener(
        "input",
        validateLive
      );

      confirm.addEventListener(
        "input",
        validateLive
      );

      birthday?.addEventListener(
        "click",
        () => {
          birthday.removeAttribute(
            "aria-invalid"
          );
        }
      );
    }

    async function miimiidAuthenticate(
      endpoint,
      payload
    ) {
      const response =
        await fetch(
          endpoint,
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(payload)
          }
        );

      let result = null;

      try {
        result = await response.json();
      } catch (error) {
        throw new Error(
          "The authentication server returned an invalid response."
        );
      }

      if (
        !response.ok ||
        !result ||
        result.status !== "success"
      ) {
        throw new Error(
          result &&
          result.message
            ? result.message
            : "Authentication request failed."
        );
      }

      if (
        result.data &&
        result.data.user
      ) {
        miimiidCurrentUser =
          result.data.user;

        window.currentUser =
          miimiidCurrentUser;

        window.MIIMIID_CURRENT_USER =
          miimiidCurrentUser;
      }

      return result;
    }

    function showMiimiidRegistrationStep(step) {
      const steps =
        document.querySelectorAll(

      if (!steps.length) {

      const requestedStep =

      steps.forEach(section => {

    function clearMiimiidVerificationTimer() {
      if (
        miimiidVerificationTimer
      ) {
        clearInterval(
          miimiidVerificationTimer
        );

        miimiidVerificationTimer =
          null;
      }
    }

    function startMiimiidVerificationTimer(
      expiresInSeconds
    ) {
      clearMiimiidVerificationTimer();

      const expires =
        Number(expiresInSeconds);

      if (
        !Number.isFinite(expires) ||
        expires <= 0
      ) {
        return;
      }

      miimiidVerificationExpiresAt =
        Date.now() +
        expires * 1000;

      const update =
        () => {
          const remaining =
            Math.max(
              0,
              Math.ceil(
                (
                  miimiidVerificationExpiresAt -
                  Date.now()
                ) / 1000
              )
            );

          const minutes =
            Math.floor(
              remaining / 60
            );

          const seconds =
            String(
              remaining % 60
            ).padStart(2, "0");

          const timer =
            document.getElementById(
              "miimiid-verification-timer"
            );

          if (timer) {
            timer.textContent =
              remaining > 0
                ? `${miimiidDashboardTranslate("authCodeExpiresIn")} ${minutes}:${seconds}`
                : miimiidDashboardTranslate("authCodeExpired");
          }

          if (remaining <= 0) {
            clearMiimiidVerificationTimer();
          }
        };

      update();

      miimiidVerificationTimer =
        setInterval(
          update,
          1000
        );
    }

    function resetMiimiidRegistrationFlow() {
      clearMiimiidVerificationTimer();

      miimiidRegistrationStep =
        1;

      miimiidVerificationEmail =
        "";

      miimiidVerificationExpiresAt =

      const code =
        document.getElementById(

      if (code) {
        code.value = "";
      }

      setMiimiidRegisterFeedback(

      showMiimiidRegistrationStep(
        1
      );
    }

          const response =
            await miimiidAuthenticate(
              "/api/auth/register",
              {
                firstName,
                lastName,
                email,
                gender,
                dateOfBirth,
                password
              }
            );

          const data =
            response?.data || {};

          if (
            data.verificationRequired
          ) {
            miimiidVerificationEmail =
              email;

            const verificationEmail =
              document.getElementById(
                "miimiid-verification-email"
              );

            if (verificationEmail) {
              verificationEmail.textContent =
                data.maskedEmail ||
                email;
            }

            const verificationCode =
              document.getElementById(
                "miimiid-register-verification-code"
              );

            if (verificationCode) {
              verificationCode.value = "";
              verificationCode.focus();
            }

            showMiimiidRegistrationStep(
              6
            );

            startMiimiidVerificationTimer(
              data.expiresInSeconds
            );

            return;
          }

          throw new Error(
            miimiidDashboardTranslate("authVerificationRequired")
          );

        } catch (error) {
          console.error(
            "Miimiid registration error:",
            error
          );

          setMiimiidRegisterFeedback(
            miimiidNormalizeAuthenticationError(
              error,
              miimiidSafeAuthMessage(
                "authUnableCreateAccount",
                "Unable to create your account."
              )
            ),
            "error"
          );
        }
      });
    }

    async function handleMiimiidVerifyAccount() {
      const code =
        document
          .getElementById(
            "miimiid-register-verification-code"
          )
          ?.value
          .trim() || "";

      const submit =
        document.getElementById(
          "miimiid-verify-account-submit"
        );

        setMiimiidRegisterFeedback(
          miimiidDashboardTranslate("authVerificationCodeRequired"),
          "error"
        );

        return;
      }

      const actionButton =
        getMiimiidAsyncButton(submit);

      if (!actionButton) {
        return;
      }

      setMiimiidRegisterFeedback(
        miimiidDashboardTranslate("authVerifyingAccount")
      );

      await actionButton.run(async () => {
        try {
          const response =
            await miimiidAuthenticate(
              "/api/auth/verify-account",
              {
                email:
                  miimiidVerificationEmail,
                code
              }
            );

          const data =
            response?.data || {};

          if (
            !data.verified
          ) {
            throw new Error(
              miimiidDashboardTranslate("authUnableVerifyAccount")

            await initializeMiimiidDashboard();

        } catch (error) {
          console.error(
            "Miimiid account verification error:",
            error
          );

          setMiimiidRegisterFeedback(
            miimiidNormalizeAuthenticationError(
              error,
              miimiidSafeAuthMessage(
                "authUnableVerifyAccount",
                "Unable to verify your account."
              )
            ),
            "error"
          );
        }
      });
    }

async function handleMiimiidForgotPassword(event) {

        document.getElementById(

          miimiidDashboardTranslate("authEnterEmail"),

        );
        return;

      const actionButton =
        getMiimiidAsyncButton(submit);

        return;
      }

      setMiimiidAuthStatus(
        miimiidDashboardTranslate("authSendingResetInstructions")
      );

      await actionButton.run(async () => {
        try {
          const response =
            await fetch(
              "/api/auth/forgot-password",
              {
                method: "POST",
                credentials: "same-origin",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: JSON.stringify({

                })
              }
            );

          const result =

          ) {

              result &&
              result.message
                ? result.message
                : miimiidDashboardTranslate("authRequestResetError")
            );
          }

          setMiimiidAuthStatus(
            result.message ||
            miimiidDashboardTranslate("authResetInstructionsSent"),
            "success"
          );

        } catch (error) {
          console.error(
            "Miimiid password reset request error:",
            error
          );

          setMiimiidAuthStatus(
            error.message ||
            miimiidDashboardTranslate("authRequestResetError"),
            "error"
          );
        }
      });
    }


    async function handleMiimiidResetPassword(event) {
      event.preventDefault();

      const token =
        new URLSearchParams(window.location.search)
          .get("resetToken");

      const password =
        document
          .getElementById("miimiid-reset-password")
          ?.value || "";

      const confirmPassword =
        document
          .getElementById("miimiid-reset-confirm")
          ?.value || "";

      const submit =
        document.getElementById("miimiid-reset-submit");

      if (!token) {
        setMiimiidAuthStatus(
          miimiidDashboardTranslate("authInvalidResetLink"),
          "error"
        );
        return;
      }

      if (password.length < 8) {
        setMiimiidAuthStatus(
          miimiidDashboardTranslate("authPasswordMinLength"),
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        setMiimiidAuthStatus(
          miimiidDashboardTranslate("authPasswordMismatch"),
          "error"
        );
        return;
      }

      const actionButton =
        getMiimiidAsyncButton(submit);

      if (!actionButton) {
        return;
      }

      setMiimiidAuthStatus(
        miimiidDashboardTranslate("authResettingPassword")
      );

      await actionButton.run(async () => {
        try {
          const response =
            await fetch(
              "/api/auth/reset-password",
              {
                method: "POST",
                credentials: "same-origin",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: JSON.stringify({
                  token,
                  password
                })
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            !result ||
            result.status !== "success"
          ) {
            throw new Error(
              result &&
              result.message
                ? result.message
                : miimiidDashboardTranslate("authResetPasswordError")
            );
          }

          setMiimiidAuthStatus(
            result.message ||
            miimiidDashboardTranslate("authPasswordResetSuccess"),
            "success"
          );

          const resetForm =
            document.getElementById(
              "miimiid-reset-form"
            );

          if (resetForm) {
            resetForm.reset();
          }

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          window.setTimeout(
            () => showMiimiidAuthMode("login"),
            900
          );

        } catch (error) {
          console.error(
            "Miimiid reset password error:",
            error
          );

          setMiimiidAuthStatus(
            error.message ||
            miimiidDashboardTranslate("authResetPasswordError"),
            "error"
          );
        }
      });
    }
