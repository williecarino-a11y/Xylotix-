function initializeMiimiidDobWheelPicker() {
  const month =
    document.getElementById("miimiid-register-dob-month");

  const day =
    document.getElementById("miimiid-register-dob-day");

  const year =
    document.getElementById("miimiid-register-dob-year");

  const hidden =
    document.getElementById("miimiid-register-dob");

  const picker =
    document.getElementById("miimiid-dob-wheel-picker");

  if (!month || !day || !year || !hidden || !picker) {
    return;
  }

  if (picker.dataset.initialized === "true") {
    return;
  }

  picker.dataset.initialized = "true";

  const translate =
    key => miimiidDashboardTranslate(key);

  const now = new Date();

  const maxDate =
    new Date(
      now.getFullYear() - 18,
      now.getMonth(),
      now.getDate()
    );

  const maxYear =
    maxDate.getFullYear();

  month.innerHTML = "";

  for (let i = 1; i <= 12; i++) {
    const option =
      document.createElement("option");

    option.value =
      String(i).padStart(2, "0");

    option.textContent =
      new Date(2000, i - 1, 1)
        .toLocaleString(
          undefined,
          { month: "long" }
        );

    month.appendChild(option);
  }

  year.innerHTML = "";

  for (
    let y = maxYear;
    y >= maxYear - 100;
    y--
  ) {
    const option =
      document.createElement("option");

    option.value =
      String(y);

    option.textContent =
      String(y);

    year.appendChild(option);
  }

  function rebuildDays() {
    const selectedYear =
      Number(year.value);

    const selectedMonth =
      Number(month.value);

    const daysInMonth =
      new Date(
        selectedYear,
        selectedMonth,
        0
      ).getDate();

    const previous =
      Number(day.value) || 1;

    day.innerHTML = "";

    for (
      let d = 1;
      d <= daysInMonth;
      d++
    ) {
      const option =
        document.createElement("option");

      option.value =
        String(d).padStart(2, "0");

      option.textContent =
        String(d);

      day.appendChild(option);
    }

    day.value =
      String(
        Math.min(previous, daysInMonth)
      ).padStart(2, "0");

    updateDob();
  }

  function updateDob() {
    const m = month.value;
    const d = day.value;
    const y = year.value;

    if (!m || !d || !y) {
      hidden.value = "";
      picker.dataset.dobValid = "false";
      return;
    }

    const selected =
      new Date(
        Number(y),
        Number(m) - 1,
        Number(d)
      );

    const valid =
      selected <= maxDate &&
      selected.getFullYear() === Number(y) &&
      selected.getMonth() === Number(m) - 1 &&
      selected.getDate() === Number(d);

    hidden.value =
      valid
        ? `${y}-${m}-${d}`
        : "";

    picker.dataset.dobValid =
      valid ? "true" : "false";
  }

  month.addEventListener(
    "change",
    rebuildDays
  );

  day.addEventListener(
    "change",
    updateDob
  );

  year.addEventListener(
    "change",
    rebuildDays
  );

  year.value =
    String(maxYear);

  month.value =
    String(maxDate.getMonth() + 1)
      .padStart(2, "0");

  rebuildDays();

  day.value =
    String(maxDate.getDate())
      .padStart(2, "0");

  updateDob();

  /*
   * Keep the accessible labels/data-driven.
   * Translation application can update these elements
   * without hardcoded UI strings.
   */
  picker
    .querySelectorAll("[data-miimiid-auth-key]")
    .forEach(element => {
      const key =
        element.getAttribute(
          "data-miimiid-auth-key"
        );

      if (key) {
        element.textContent =
          translate(key);
      }
    });
}


function initializeMiimiidBirthdayWheelModal() {
  const trigger =
    document.getElementById("miimiid-register-birthday-trigger");

  const modal =
    document.getElementById("miimiid-birthday-picker-modal");

  const valueDisplay =
    document.getElementById("miimiid-register-birthday-value");

  const monthSelect =
    document.getElementById("miimiid-register-dob-month");

  const daySelect =
    document.getElementById("miimiid-register-dob-day");

  const yearSelect =
    document.getElementById("miimiid-register-dob-year");

  const hiddenDob =
    document.getElementById("miimiid-register-dob");

  const monthList =
    document.getElementById("miimiid-birthday-month-list");

  const dayList =
    document.getElementById("miimiid-birthday-day-list");

  const yearList =
    document.getElementById("miimiid-birthday-year-list");

  const cancelButton =
    document.getElementById("miimiid-birthday-picker-cancel");

  const setButton =
    document.getElementById("miimiid-birthday-picker-set");

  if (
    !trigger ||
    !modal ||
    !valueDisplay ||
    !monthSelect ||
    !daySelect ||
    !yearSelect ||
    !hiddenDob ||
    !monthList ||
    !dayList ||
    !yearList ||
    !cancelButton ||
    !setButton
  ) {
    return;
  }

  if (modal.dataset.initialized === "true") {
    return;
  }

  modal.dataset.initialized = "true";

  const now = new Date();

  const maxDate = new Date(
    now.getFullYear() - 18,
    now.getMonth(),
    now.getDate()
  );

  const currentYear = now.getFullYear();

  const MIN_YEAR = 1900;

  let draftMonth = null;
  let draftDay = null;
  let draftYear = null;

  let previousFocus = null;

  const monthNames = Array.from(
    { length: 12 },
    (_, index) =>
      new Date(2000, index, 1).toLocaleString(
        undefined,
        { month: "long" }
      )
  );

  function daysInMonth(year, month) {
    return new Date(
      Number(year),
      Number(month),
      0
    ).getDate();
  }

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function dateKey(year, month, day) {
    return `${year}-${pad(month)}-${pad(day)}`;
  }

  function isValidDate(year, month, day) {
    if (
      !Number.isInteger(year) ||
      !Number.isInteger(month) ||                                                                          !Number.isInteger(day)
    ) {
      return false;
    }

    const selected =
      new Date(year, month - 1, day);

    return (
      selected.getFullYear() === year &&
      selected.getMonth() === month - 1 &&
      selected.getDate() === day &&
      year >= MIN_YEAR &&
      selected <= maxDate
    );
  }

  function setHiddenValues(year, month, day) {
    yearSelect.value = String(year);
    monthSelect.value = pad(month);
    daySelect.value = pad(day);

    hiddenDob.value =
      dateKey(year, month, day);

    const picker =
      document.getElementById(
        "miimiid-birthday-picker-modal"
      );

    if (picker) {
      picker.dataset.dobValid =
        isValidDate(year, month, day)
          ? "true"
          : "false";
    }
  }

  function updateVisibleBirthday() {
    if (
      !draftYear ||
      !draftMonth ||
      !draftDay
    ) {
      valueDisplay.textContent = "";
      return;
    }

    valueDisplay.textContent =
      `${monthNames[draftMonth - 1]} ${draftDay}, ${draftYear}`;
  }

  function createWheelOption(
    value,
    label,
    selected,
    disabled = false
  ) {
    const option =
      document.createElement("div");

    option.className =
      "miimiid-wheel-option";

    if (selected) {
      option.classList.add("is-selected");
    }

    if (disabled) {
      option.classList.add("is-disabled");
      option.setAttribute("aria-disabled", "true");
    }

    option.dataset.value =
      String(value);

    option.textContent =
      label;

    option.setAttribute(
      "role",
      "option"
    );

    option.setAttribute(
      "aria-selected",
      selected ? "true" : "false"
    );

    return option;
  }

  function updateSelectedVisual(list) {
    const options =
      list.querySelectorAll(
        ".miimiid-wheel-option"
      );

    if (!options.length) {
      return;
    }

    const center =
      list.scrollTop +
      list.clientHeight / 2;

    let closest = null;
    let closestDistance = Infinity;

    options.forEach(option => {
      const optionCenter =
        option.offsetTop +
        option.offsetHeight / 2;

      const distance =
        Math.abs(optionCenter - center);

      if (distance < closestDistance) {
        closestDistance = distance;
        closest = option;
      }
    });

    options.forEach(option => {
      const selected =
        option === closest;

      option.classList.toggle(
        "is-selected",
        selected
      );

      option.setAttribute(
        "aria-selected",
        selected ? "true" : "false"
      );
    });
  }

  function scrollWheelToValue(
    list,
    value,
    instant = false
  ) {
    const option =
      list.querySelector(
        `[data-value="${CSS.escape(String(value))}"]`
      );

    if (!option) {
      return;
    }

    list.scrollTo({
      top:
        option.offsetTop -
        (list.clientHeight / 2) +
        (option.offsetHeight / 2),
      behavior:
        instant ? "auto" : "smooth"
    });

    window.setTimeout(
      () => updateSelectedVisual(list),
      instant ? 0 : 220
    );
  }

  function populateMonths() {
    monthList.innerHTML = "";

    monthNames.forEach(
      (name, index) => {
        const month =
          index + 1;

        const option =
          createWheelOption(
            pad(month),
            name,
            month === draftMonth
          );

        option.addEventListener(
          "click",
          () => {
            draftMonth = month;

            const maxDay =
              daysInMonth(
                draftYear,
                draftMonth
              );

            if (draftDay > maxDay) {
              draftDay = maxDay;
            }

            populateDays();

            scrollWheelToValue(
              monthList,
              pad(draftMonth)
            );
          }
        );

        monthList.appendChild(option);
      }
    );
  }

  function populateDays() {
    dayList.innerHTML = "";

    const maximum =
      daysInMonth(
        draftYear,
        draftMonth
      );

    for (
      let day = 1;
      day <= maximum;
      day++
    ) {
      const candidate =
        new Date(
          draftYear,
          draftMonth - 1,
          day
        );

      const disabled =
        candidate > maxDate;

      const option =
        createWheelOption(
          pad(day),
          day,
          day === draftDay,
          disabled
        );

      if (!disabled) {
        option.addEventListener(
          "click",
          () => {
            draftDay = day;

            scrollWheelToValue(
              dayList,
              pad(draftDay)
            );
          }
        );
      }

      dayList.appendChild(option);
    }
  }

  function populateYears() {
    yearList.innerHTML = "";

    /*
     * Dynamic range:
     * 1900 -> current year.
     *
     * Future years never appear.
     *
     * Years after the maximum valid
     * age-18 boundary remain visible
     * but are disabled.
     */
    for (
      let year = currentYear;
      year >= MIN_YEAR;
      year--
    ) {
      const disabled =
        year > maxDate.getFullYear();

      const option =
        createWheelOption(
          year,
          year,
          year === draftYear,
          disabled
        );

      if (!disabled) {
        option.addEventListener(
          "click",
          () => {
            draftYear = year;

            const maximum =
              daysInMonth(
                draftYear,
                draftMonth
              );

            if (draftDay > maximum) {
              draftDay = maximum;
            }

            populateDays();

            scrollWheelToValue(
              yearList,
              draftYear
            );
          }
        );
      }

      yearList.appendChild(option);
    }
  }

  function attachScrollSelection(
    list,
    onSelection
  ) {
    let timer = null;

    list.addEventListener(
      "scroll",
      () => {
        updateSelectedVisual(list);

        window.clearTimeout(timer);

        timer =
          window.setTimeout(
            () => {
              const options =
                list.querySelectorAll(
                  ".miimiid-wheel-option"
                );

              if (!options.length) {
                return;
              }

              const center =
                list.scrollTop +
                list.clientHeight / 2;

              let closest = null;
              let distance = Infinity;

              options.forEach(
                option => {
                  const optionCenter =
                    option.offsetTop +
                    option.offsetHeight / 2;

                  const currentDistance =
                    Math.abs(
                      optionCenter -
                      center
                    );

                  if (
                    currentDistance <
                    distance
                  ) {
                    distance =
                      currentDistance;
                    closest =
                      option;
                  }
                }
              );

              if (
                closest &&
                !closest.classList.contains(
                  "is-disabled"
                )
              ) {
                onSelection(
                  closest.dataset.value
                );
              }

              updateSelectedVisual(list);
            },
            90
          );
      },
      { passive: true }
    );
  }

  attachScrollSelection(
    monthList,
    value => {
      draftMonth =
        Number(value);

      const maximum =
        daysInMonth(
          draftYear,
          draftMonth
        );

      if (draftDay > maximum) {
        draftDay = maximum;
        populateDays();
        scrollWheelToValue(
          dayList,
          pad(draftDay),
          true
        );
      }
    }
  );

  attachScrollSelection(
    dayList,
    value => {
      draftDay =
        Number(value);
    }
  );

  attachScrollSelection(
    yearList,
    value => {
      const selectedYear =
        Number(value);

      if (
        selectedYear <=
        maxDate.getFullYear()
      ) {
        draftYear =
          selectedYear;

        const maximum =
          daysInMonth(
            draftYear,
            draftMonth
          );

        if (draftDay > maximum) {
          draftDay = maximum;
          populateDays();
          scrollWheelToValue(
            dayList,
            pad(draftDay),
            true
          );
        }
      }
    }
  );

  function initializeDraftDate() {
    const existing =
      hiddenDob.value;

    if (
      /^\d{4}-\d{2}-\d{2}$/.test(existing)
    ) {
      const [
        year,
        month,
        day
      ] = existing
        .split("-")
        .map(Number);

      if (
        isValidDate(
          year,
          month,
          day
        )
      ) {
        draftYear = year;
        draftMonth = month;
        draftDay = day;
        return;
      }
    }

    /*
     * Default to the newest date that
     * is actually valid for the age-18
     * requirement.
     */
    draftYear =
      maxDate.getFullYear();

    draftMonth =
      maxDate.getMonth() + 1;

    draftDay =
      maxDate.getDate();
  }

  function renderDraftWheels() {
    populateMonths();
    populateDays();
    populateYears();

    requestAnimationFrame(() => {
      scrollWheelToValue(
        monthList,
        pad(draftMonth),
        true
      );

      scrollWheelToValue(
        dayList,
        pad(draftDay),
        true
      );

      scrollWheelToValue(
        yearList,
        draftYear,
        true
      );
    });
  }

  function openPicker() {
    previousFocus =
      document.activeElement;

    initializeDraftDate();

    renderDraftWheels();

    modal.classList.remove(
      "hidden"
    );

    modal.setAttribute(
      "aria-hidden",
      "false"
    );

    trigger.setAttribute(
      "aria-expanded",
      "true"
    );

    document.body.classList.add(
      "miimiid-birthday-picker-open"
    );

    requestAnimationFrame(() => {
      monthList.focus();
    });
  }

  function closePicker() {
    modal.classList.add(
      "hidden"
    );

    modal.setAttribute(
      "aria-hidden",
      "true"
    );

    trigger.setAttribute(
      "aria-expanded",
      "false"
    );

    document.body.classList.remove(
      "miimiid-birthday-picker-open"
    );

    if (
      previousFocus &&
      typeof previousFocus.focus ===
        "function"
    ) {
      previousFocus.focus();
    }
  }

  function setPickerValue() {
    if (
      !isValidDate(
        draftYear,
        draftMonth,
        draftDay
      )
    ) {
      return;
    }

    setHiddenValues(
      draftYear,
      draftMonth,
      draftDay
    );

    updateVisibleBirthday();

    closePicker();

    /*
     * Keep existing DOB listeners and
     * registration validation in sync.
     */
    [
      monthSelect,
      daySelect,
      yearSelect
    ].forEach(
      element => {
        element.dispatchEvent(
          new Event(
            "change",
            { bubbles: true }
          )
        );
      }
    );
  }

  trigger.addEventListener(
    "click",
    openPicker
  );

  cancelButton.addEventListener(
    "click",
    closePicker
  );

  setButton.addEventListener(
    "click",
    setPickerValue
  );

  modal.addEventListener(
    "click",
    event => {
      if (
        event.target === modal
      ) {
        closePicker();
      }
    }
  );

  document.addEventListener(
    "keydown",
    event => {
      if (
        modal.classList.contains(
          "hidden"
        )
      ) {
        return;
      }

      if (
        event.key === "Escape"
      ) {
        closePicker();
      }
    }
  );

  /*
   * Keep the visible field synchronized
   * when the existing registration flow
   * restores DOB state.
   */
  if (
    hiddenDob.value &&
    /^\d{4}-\d{2}-\d{2}$/.test(
      hiddenDob.value
    )
  ) {
    const [
      year,
      month,
      day
    ] = hiddenDob.value
      .split("-")
      .map(Number);

    if (
      isValidDate(
        year,
        month,
        day
      )
    ) {
      draftYear = year;
      draftMonth = month;
      draftDay = day;

      updateVisibleBirthday();
    }
  }
}


/*
 * MIIMIID REUSABLE ASYNC BUTTON
 *
 * Centralized primary-action lifecycle:
 *
 * idle -> loading -> success/error -> idle
 *
 * The component owns:
 * - duplicate-tap protection
 * - disabled state
 * - spinner presentation
 * - guaranteed loading cleanup
 *
 * The caller owns:
 * - validation
 * - API/business logic
 * - navigation
 * - user-facing error handling
 */
function MiimiidAsyncButton(button) {
  if (!button) {
    return null;
  }

  if (button.__miimiidAsyncButton) {
    return button.__miimiidAsyncButton;
  }

  const originalHTML = button.innerHTML;
  const initialDisabled = button.disabled;

  button.classList.add("miimiid-async-button");

  /*
   * Preserve the existing button content and dimensions.
   * The loader is layered over the content.
   */
  button.innerHTML = `
    <span
      class="miimiid-async-button-content"
    >
      ${originalHTML}
    </span>
    <span
      class="miimiid-async-button-spinner"
      aria-hidden="true"
    ></span>
  `;

  let state = "idle";
  let actionRunning = false;
  let explicitDisabled = initialDisabled;

  const setState = nextState => {
    state = nextState;
    button.dataset.miimiidState = nextState;

    if (nextState === "loading") {
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      return;
    }

    button.removeAttribute("aria-busy");

    if (
      nextState === "idle" ||
      nextState === "success" ||
      nextState === "error"
    ) {
      button.disabled = explicitDisabled;
    }
  };

  const setEnabled = enabled => {
    explicitDisabled = !enabled;

    button.dataset.miimiidExplicitDisabled =
      explicitDisabled ? "true" : "false";

    if (!actionRunning) {
      button.disabled = explicitDisabled;
    }
  };

  const run = async (
    action,
    {
      onSuccess = null,
      onError = null,
      onFinally = null
    } = {}
  ) => {
    /*
     * Synchronous duplicate-submission guard.
     */
    if (
      actionRunning ||
      state === "loading" ||
      button.disabled
    ) {
      return undefined;
    }

    if (typeof action !== "function") {
      const error = new TypeError(
        "MiimiidAsyncButton.run requires an async action function."
      );

      setState("error");

      if (typeof onError === "function") {
        try {
          await onError(error);
        } catch (callbackError) {
          console.error(
            "Miimiid async-button error handler failed:",
            callbackError
          );
        }
      }

      setState("idle");
      return undefined;
    }

    actionRunning = true;
    setState("loading");

    console.log(
      "[MIIMIID ASYNC] loading committed",
      {
        id: button.id,
        ariaBusy: button.getAttribute("aria-busy"),
        state: button.dataset.miimiidState,
        timestamp: performance.now()
      }
    );

    /*
     * Synchronize with two real browser rendering frames so the
     * loading state is committed and visibly paintable before the
     * authentication operation or local authentication transition.
     *
     * This is not an artificial timeout. It does not determine the
     * duration of the real operation; the real Promise remains the
     * source of the loading lifecycle.
     */
    await new Promise(resolve => {
      requestAnimationFrame(() => {
        console.log(
          "[MIIMIID ASYNC] first RAF",
          {
            id: button.id,
            ariaBusy: button.getAttribute("aria-busy"),
            state: button.dataset.miimiidState,
            timestamp: performance.now()
          }
        );

        requestAnimationFrame(() => {
          console.log(
            "[MIIMIID ASYNC] second RAF",
            {
              id: button.id,
              ariaBusy: button.getAttribute("aria-busy"),
              state: button.dataset.miimiidState,
              timestamp: performance.now()
            }
          );

          resolve();
        });
      });
    });

    try {
      console.log(
        "[MIIMIID ASYNC] action starting",
        {
          id: button.id,
          ariaBusy: button.getAttribute("aria-busy"),
          state: button.dataset.miimiidState,
          timestamp: performance.now()
        }
      );

      const result = await action();

      setState("success");

      if (typeof onSuccess === "function") {
        await onSuccess(result);
      }

      return result;

    } catch (error) {
      setState("error");

      if (typeof onError === "function") {
        try {
          await onError(error);
        } catch (callbackError) {
          console.error(
            "Miimiid async-button error handler failed:",
            callbackError
          );
        }
      }

      throw error;

    } finally {
      actionRunning = false;

      /*
       * Guaranteed release after the real Promise settles.
       */
      setState("idle");

      if (typeof onFinally === "function") {
        try {
          await onFinally();
        } catch (callbackError) {
          console.error(
            "Miimiid async-button finally handler failed:",
            callbackError
          );
        }
      }
    }
  };

  const api = {
    get state() {
      return state;
    },

    get loading() {
      return actionRunning;
    },

    run,
    setState,
    setEnabled,

    reset() {
      actionRunning = false;
      setState("idle");
    }
  };

  button.__miimiidAsyncButton = api;

  button.dataset.miimiidExplicitDisabled =
    explicitDisabled ? "true" : "false";

  button.dataset.miimiidState = "idle";

  button.removeAttribute("aria-busy");

  return api;
}


/*
 * MIIMIID AUTH STEP TRANSITION
 *
 * Registration steps are local UI state transitions rather
 * than network operations. They still need one browser-render
 * opportunity so the async-button loading state can actually
 * become visible before the next authentication screen is
 * rendered.
 *
 * No artificial timeout is used.
 */
async function runMiimiidAuthStepTransition(
  button,
  transition
) {
  const actionButton =
    getMiimiidAsyncButton(button);

  if (!actionButton) {
    console.error(
      "[MIIMIID REGISTRATION ASYNC] unable to obtain controller:",
      button?.id
    );

    return false;
  }

  console.log(
    "[MIIMIID REGISTRATION ASYNC] transition requested:",
    {
      id: button.id,
      state: actionButton.state,
      loading: actionButton.loading,
      disabled: button.disabled
    }
  );

  try {
    await actionButton.run(async () => {
      console.log(
        "[MIIMIID REGISTRATION ASYNC] transition action starting:",
        button.id
      );

      if (typeof transition !== "function") {
        throw new Error(
          "Miimiid registration transition is unavailable."
        );
      }

      await transition();

      console.log(
        "[MIIMIID REGISTRATION ASYNC] transition completed:",
        button.id
      );
    });

    return true;

  } catch (error) {
    console.error(
      "[MIIMIID REGISTRATION ASYNC] transition failed:",
      button.id,
      error
    );

    setMiimiidRegisterFeedback(
      error?.message ||
      miimiidSafeAuthMessage(
        "authUnableContinue",
        "We couldn't continue right now. Please try again."
      ),
      "error"
    );

    return false;
  }
}

function getMiimiidAsyncButton(buttonOrId) {
  const button =
    typeof buttonOrId === "string"
      ? document.getElementById(buttonOrId)
      : buttonOrId;

  return MiimiidAsyncButton(button);
}


/*
 * Backward-compatible adapter.
 *
 * Existing authentication code can continue calling this
 * temporarily while individual handlers are migrated.
 */
function setMiimiidAuthActionLoading(
  button,
  isLoading
) {
  const controller =
    getMiimiidAsyncButton(button);

  if (!controller) {
    return;
  }

  if (isLoading) {
    controller.setState("loading");
  } else {
    controller.reset();
  }
}


function initializeMiimiidRegistrationFlow() {
      const form =
        document.getElementById(
          "miimiid-register-form"
        );

      if (!form) {
        return;
      }

      if (
        form.dataset.registrationInitialized ===
        "true"
      ) {
        return;
      }

      form.dataset.registrationInitialized =
        "true";

      /*
       * Initialize every registration primary action through
       * the same reusable async-button controller used by
       * Login and Forgot Password.
       *
       * This is deliberately done before any registration
       * click/submit handler can invoke the buttons.
       */
      [
        "miimiid-register-get-started",
        "miimiid-register-name-next",
        "miimiid-register-contact-next",
        "miimiid-register-details-next",
        "miimiid-register-submit",
        "miimiid-verify-account-submit",
        "miimiid-resend-verification"
      ].forEach(buttonId => {
        const button =
          document.getElementById(buttonId);

        if (!button) {
          console.warn(
            "[MIIMIID REGISTRATION ASYNC] button missing:",
            buttonId
          );
          return;
        }

        const controller =
          getMiimiidAsyncButton(button);

        console.log(
          "[MIIMIID REGISTRATION ASYNC] initialized:",
          {
            id: button.id,
            controller: !!controller,
            disabled: button.disabled,
            state: button.dataset.miimiidState
          }
        );
      });

      initializeMiimiidGenderSelector();
      initializeMiimiidDobWheelPicker();
      initializeMiimiidBirthdayWheelModal();
      initializeMiimiidRegistrationValidation();

      document
        .getElementById(
          "miimiid-register-get-started"
        )
        ?.addEventListener(
          "click",
          async () => {
            const button =
              document.getElementById(
                "miimiid-register-get-started"
              );

            await runMiimiidAuthStepTransition(
              button,
              () => {
                showMiimiidRegistrationStep(2);
              }
            );
          }
        );

      document
        .getElementById(
          "miimiid-register-name-next"
        )
        ?.addEventListener(
          "click",
          async () => {
            const button =
              document.getElementById(
                "miimiid-register-name-next"
              );

            const firstName =
              document
                .getElementById(
                  "miimiid-register-first-name"
                )
                ?.value
                .trim() || "";

            const lastName =
              document
                .getElementById(
                  "miimiid-register-last-name"
                )
                ?.value
                .trim() || "";

            if (!firstName) {
              setMiimiidRegisterFeedback(
                miimiidDashboardTranslate(
                  "authEnterFirstName"
                ),
                "error"
              );
              return;
            }

            if (!lastName) {
              setMiimiidRegisterFeedback(
                miimiidDashboardTranslate(
                  "authEnterLastName"
                ),
                "error"
              );
              return;
            }

            await runMiimiidAuthStepTransition(
              button,
              () => {
                showMiimiidRegistrationStep(3);
              }
            );
          }
        );

      document
        .getElementById(
          "miimiid-register-contact-next"
        )
        ?.addEventListener(
          "click",
          async () => {
            const button =
              document.getElementById(
                "miimiid-register-contact-next"
              );

            const email =
              document
                .getElementById(
                  "miimiid-register-email"
                )
                ?.value
                .trim() || "";

            if (
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                email
              )
            ) {
              setMiimiidRegisterFeedback(
                miimiidDashboardTranslate(
                  "authEnterValidEmail"
                ),
                "error"
              );
              return;
            }

            await runMiimiidAuthStepTransition(
              button,
              () => {
                showMiimiidRegistrationStep(4);
              }
            );
          }
        );

      document
        .getElementById(
          "miimiid-register-details-next"
        )
        ?.addEventListener(
          "click",
          async () => {
            const button =
              document.getElementById(
                "miimiid-register-details-next"
              );

            const gender =
              document
                .getElementById(
                  "miimiid-register-gender"
                )
                ?.value
                .trim() || "";

            if (!gender) {
              setMiimiidRegisterFeedback(
                miimiidDashboardTranslate(
                  "authSelectGender"
                ),
                "error"
              );
              return;
            }

            if (!miimiidValidateBirthday()) {
              setMiimiidRegisterFeedback(
                miimiidSafeAuthMessage(
                  "authBirthdayInvalid",
                  "Please select a valid birthday."
                ),
                "error"
              );
              return;
            }

            await runMiimiidAuthStepTransition(
              button,
              () => {
                showMiimiidRegistrationStep(5);
              }
            );
          }
        );

      document
        .getElementById(
          "miimiid-verify-account-submit"
        )
        ?.addEventListener(
          "click",
          handleMiimiidVerifyAccount
        );

      document
        .getElementById(
          "miimiid-resend-verification"
        )
        ?.addEventListener(
          "click",
          handleMiimiidResendVerification
        );

      form
        .querySelectorAll(
          "[data-register-back]"
        )
        .forEach(button => {
          button.addEventListener(
            "click",
            () => {
              const target =
                Number(
                  button.getAttribute(
                    "data-register-back"
                  )
                );

              showMiimiidRegistrationStep(
                target
              );
            }
          );
        });
    }




function initializeMiimiidAuth() {
      if (miimiidAuthInitialized) {
        return;
      }

      miimiidAuthInitialized = true;

      /*
       * Wire the authentication controls FIRST.
       *
       * Authentication navigation must never depend on the
       * localization layer, password UI, or registration helpers
       * completing successfully. A failure in one optional helper
       * must not leave Sign In, Create Account, or Forgot Password
       * completely inert.
       */
      const loginForm =
        document.getElementById("miimiid-login-form");
      const registerForm =
        document.getElementById("miimiid-register-form");
      const forgotForm =
        document.getElementById("miimiid-forgot-form");
      const resetForm =
        document.getElementById("miimiid-reset-form");

      if (loginForm) {
        loginForm.addEventListener("submit", handleMiimiidLogin);
      }

      if (registerForm) {
        registerForm.addEventListener("submit", handleMiimiidRegister);
      }

      if (forgotForm) {
        forgotForm.addEventListener("submit", handleMiimiidForgotPassword);
      }

      if (resetForm) {
        resetForm.addEventListener("submit", handleMiimiidResetPassword);
      }

      document
        .getElementById("miimiid-show-register")
        ?.addEventListener("click", () => showMiimiidAuthMode("register"));

      document
        .getElementById("miimiid-show-forgot")
        ?.addEventListener("click", () => showMiimiidAuthMode("forgot"));

      document
        .getElementById("miimiid-show-login-from-register")
        ?.addEventListener("click", () => showMiimiidAuthMode("login"));

      document
        .getElementById("miimiid-show-login-from-forgot")
        ?.addEventListener("click", () => showMiimiidAuthMode("login"));

      document
        .getElementById("miimiid-show-login-from-reset")
        ?.addEventListener("click", () => showMiimiidAuthMode("login"));

      initializeMiimiidRegistrationFlow();

      /*
       * Secondary auth UI initialization is deliberately isolated.
       * These helpers must not be able to disable the core auth flow.
       */
      try {
        initializeMiimiidPasswordToggles();
      } catch (error) {
        console.error("Miimiid password UI initialization failed:", error);
      }

      try {
        applyMiimiidAuthTranslations();
      } catch (error) {
        console.error("Miimiid auth translation initialization failed:", error);
      }

      try {
        initializeMiimiidRegistrationFlow();
      } catch (error) {
        console.error("Miimiid registration initialization failed:", error);
      }
    }

    async function initializeMiimiidApplication() {
      
      const authLoading =
        document.getElementById(
          "miimiid-auth-loading"
        );

      const authView =
        document.getElementById(
          "miimiid-auth-view"
        );

      const authCard =
        document.getElementById(
          "miimiid-auth-card"
        );

      const appShell =
        document.getElementById(
          "miimiid-app-shell"
        );

      const miimiidHeader =
        document.querySelector(
          ".miimiid-header"
        );

      const drawerBackdrop =
        document.getElementById(
          "miimiid-drawer-backdrop"
        );

      /*
       * Authentication is the application boot gate.
       *
       * The authenticated application must remain hidden
       * until /api/auth/me positively confirms a valid
       * authenticated user.
       */
      if (appShell) {
        appShell.classList.add("hidden");
      }

      if (miimiidHeader) {
        miimiidHeader.classList.add("hidden");
      }

      if (drawerBackdrop) {
        drawerBackdrop.classList.add("hidden");
      }

      if (authView) {
        authView.classList.remove("hidden");
      }

      if (authLoading) {
        authLoading.classList.remove("hidden");
      }

      if (authCard) {
        authCard.classList.add("hidden");
      }

      const resetToken =
        new URLSearchParams(window.location.search)
          .get("resetToken");

      if (resetToken) {
        showMiimiidAuthView();
        showMiimiidAuthMode("reset");
        return;
      }

      let user = null;

      try {
        user =
          await loadMiimiidCurrentUser();
      } catch (error) {
        console.error(
          "Miimiid authentication bootstrap error:",
          error
        );

        if (
          error &&
          error.connectionProblem &&
          window.MiimiidConnection
        ) {
          window.MiimiidConnection.showRetry();
          return;
        }

        user = null;
      }

      /*
       * No authenticated user means the application must
       * stop at authentication. Do not initialize courses,
       * dashboard data, Fun Center, AI Tutor, or other
       * authenticated application state.
       */
      if (!user) {
        showMiimiidAuthView();
        showMiimiidAuthMode("login");

        if (authLoading) {
          authLoading.classList.add("hidden");
        }

        if (authCard) {
          authCard.classList.remove("hidden");
        }

        return;
      }

      /*
       * Only a positively authenticated user can cross
       * the authentication boundary.
       *
       * Keep the authenticated application shell hidden
       * until dashboard initialization has completed
       * successfully. initializeMiimiidDashboard() owns
       * the final visibility transition.
       */
      if (appShell) {
        appShell.classList.add("hidden");
      }

      if (miimiidHeader) {
        miimiidHeader.classList.add("hidden");
      }

      if (drawerBackdrop) {
        drawerBackdrop.classList.add("hidden");
      }

      const dashboardReady =
        await initializeMiimiidDashboard();

      if (!dashboardReady) {
        /*
         * Dashboard initialization owns its failure state
         * and restores the authentication view.
         */
        return;
      }
    }

    /* =========================================
       FETCH ALL COURSES
       ========================================= */

async function fetchCourses() {

  showLoading(true);
  hideError();

  const container =
    document.getElementById("courses-container");

  try {

    const response =
      await fetch(`/api/learn/courses?language=${encodeURIComponent(getSavedLanguage())}`);

    const result =
      await response.json();

    console.log("Courses API response:", result);

    if (
      !response.ok ||
      result.status !== "success"
    ) {
      throw new Error(
        result.message ||
        miimiidTranslate(
          "unableToLoadCourses",
          getSavedLanguage()
        )
      );
    }

    const courses =
      Array.isArray(result.data)
        ? result.data
        : [];

    if (courses.length === 0) {

      container.innerHTML = `
        <div class="card">
          <p>${miimiidTranslate("noModules", getSavedLanguage())}</p>
        </div>
      `;

      return;
    }

    container.innerHTML =
      courses
        .map(
          course => `
            <div class="card">

              <h3>
                ${escapeHtml(
                  course.title ||
                  ""
                )}
              </h3>

              <p>
                ${escapeHtml(
                  course.description ||
                  miimiidTranslate(
                    "noDescription",
                    getSavedLanguage()
                  )
                )}
              </p>

              <button
                class="btn"
                onclick="openCourse('${course._id}')"
              >
                ${miimiidTranslate(
                  "openCourse",
                  getSavedLanguage()
                )}
              </button>

            </div>
          `
        )
        .join("");

  } catch (error) {

    console.error(
      "fetchCourses error:",
      error
    );

    showError(
      miimiidTranslate(
        "unableToLoadCourses",
        getSavedLanguage()
      )
    );

  } finally {

    showLoading(false);

  }
}

/* =========================================
       OPEN COURSE
       ========================================= */

async function openCourse(courseId) {
  if (!courseId) {
    showError(
      miimiidTranslate(
        "invalidCourseId",
        getSavedLanguage()
      )
    );
    return;
  }

  currentCourseId = courseId;

  showLoading(true);
  hideError();

  try {
    const response = await fetch(
      `/api/learn/courses/${courseId}?language=${encodeURIComponent(getSavedLanguage())}`
    );

    const data = await response.json();

    if (
      response.ok &&
      data.status === "success" &&
      data.data
    ) {
      courseDataCache = data.data;

      document
        .getElementById("course-list-view")
        .classList.add("hidden");

      document
        .getElementById("lesson-view")
        .classList.add("hidden");

      document
        .getElementById("course-detail-view")
        .classList.remove("hidden");

      document
        .getElementById("detail-course-title")
        .innerText =
          courseDataCache.title ||
          "";

      document
        .getElementById("detail-course-desc")
        .innerText =
          courseDataCache.description ||
          miimiidTranslate(
            "noDescription",
            getSavedLanguage()
          );

      renderModules(
        courseDataCache.modules
      );

      await loadCourseProgress(
        courseId
      );

    } else {
      console.error(
        "Course loading failed:",
        data
      );

      showError(
        data.message ||
        miimiidTranslate(
          "unableToLoadCourse",
          getSavedLanguage()
        )
      );
    }

  } catch (error) {
    console.error(
      "openCourse error:",
      error
    );

    showError(
      miimiidTranslate(
        "unableToConnect",
        getSavedLanguage()
      )
    );

  } finally {
    showLoading(false);
  }
}

    /* =========================================
       LOAD COURSE PROGRESS
       ========================================= */

async function loadCourseProgress(courseId) {

  const card =
    document.getElementById(
      "course-progress-card"
    );

  const percent =
    document.getElementById(
      "course-progress-percent"
    );

  const bar =
    document.getElementById(
      "course-progress-bar"
    );

  const text =
    document.getElementById(
      "course-progress-text"
    );

  if (
    !card ||
    !percent ||
    !bar ||
    !text
  ) {
    return;
  }

  try {

    const userId =
      getMiimiidCurrentUserId();

    if (!userId) {
      card.classList.add("hidden");
      return;
    }

    const response =
      await fetch(
        `/api/learn/courses/${courseId}/progress/${encodeURIComponent(userId)}`
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      data.status !== "success" ||
      !data.data
    ) {
      card.classList.add("hidden");
      return;
    }

    const progress =
      data.data;

    const progressPercentage =
      Number(
        progress.progressPercentage || 0
      );

    const completedLessons =
      Number(
        progress.completedLessons || 0
      );

    const totalLessons =
      Number(
        progress.totalLessons || 0
      );

    percent.innerText =
      `${progressPercentage}%`;

    bar.style.width =
      `${progressPercentage}%`;

    text.innerText =
      `${completedLessons} of ${totalLessons} lessons completed`;

    card.classList.remove("hidden");

    /*
     * Keep authoritative completion IDs
     * available to the lesson/module UI.
     */
    courseDataCache.completedLessonIds =
      Array.isArray(
        progress.completedLessonIds
      )
        ? progress.completedLessonIds
        : [];

  } catch (error) {

    console.error(
      "Course progress loading error:",
      error
    );

    card.classList.add("hidden");
  }
}


/* =========================================

    function renderModules(modules) {

      const container =
        document.getElementById(
          "modules-container"
        );

      if (
        !Array.isArray(modules) ||
        modules.length === 0
      ) {

        container.innerHTML = `
          <div class="card">
            <p>
              ${miimiidTranslate(
                "noModules",
                getSavedLanguage()
              )}
            </p>
          </div>
        `;

        return;
      }

      container.innerHTML =
        modules.map(
          (module, moduleIndex) => {

            const lessons =
              Array.isArray(
                module.lessons
              )
                ? module.lessons
                : [];

            const completedLessonIds =
              Array.isArray(
                courseDataCache &&
                courseDataCache.completedLessonIds
              )
                ? courseDataCache.completedLessonIds
                : [];

            const completedCount =
              lessons.filter(
                lesson =>
                  completedLessonIds.includes(
                    String(lesson._id)
                  )
              ).length;

            const moduleIsComplete =
              lessons.length > 0 &&
              completedCount === lessons.length;

            const currentLanguage =
              getSavedLanguage();

            const moduleProgressText =
              lessons.length > 0
                ? moduleIsComplete
                  ? miimiidTranslate(
                      "moduleComplete",
                      currentLanguage
                    )
                  : `${completedCount} of ${lessons.length} ${miimiidTranslate(
                      "lessonsComplete",
                      currentLanguage
                    )}`
                : miimiidTranslate(
                    "noLessonsYet",
                    currentLanguage
                  );

            return `

              <div class="card">

                <p
                  class="module-progress ${
                    moduleIsComplete
                      ? "module-complete"
                      : ""
                  }"
                >
                  ${moduleProgressText}
                </p>

              <h3>
              ${escapeHtml(
              module.title ||
             `Module ${moduleIndex + 1}`
             )}
          </h3>

                ${
                  lessons.length === 0

                    ? `
                      <p>
                        ${miimiidTranslate(
                          "noLessons",
                          getSavedLanguage()
                        )}
                      </p>
                    `

                    : `
                      <ul>

                        ${
                          lessons.map(
                            lesson => `

                              <li>

                                <div
                                  class="lesson-row ${
                                    completedLessonIds.includes(
                                      String(lesson._id)
                                    )
                                      ? "completed"
                                      : ""
                                  }"
                                >

                                  <span>
                                    ${
                                      completedLessonIds.includes(
                                        String(lesson._id)
                                      )
                                        ? `<span class="lesson-completed">${miimiidTranslate(
                                            "completed",
                                            getSavedLanguage()
                                          )}</span>`
                                        : ""
                                    }
                                    ${escapeHtml(
                                      lesson.title ||
                                      miimiidTranslate("untitledLesson", getSavedLanguage())
                                    )}
                                  </span>

                                  <button
                                    class="btn btn-sm"
                                    onclick="openLesson('${lesson._id}')"
                                  >
                                    ${
                                      completedLessonIds.includes(
                                        String(lesson._id)
                                      )
                                        ? miimiidTranslate(
                                            "reviewLesson",
                                            getSavedLanguage()
                                          )
                                        : miimiidTranslate(
                                            "startLesson",
                                            getSavedLanguage()
                                          )

    /* =========================================
       OPEN LESSON
       ========================================= */

    function openLesson(lessonId) {

      currentLessonId = lessonId;

      if (
        !courseDataCache ||
        !Array.isArray(
          courseDataCache.modules
        )
      ) {

        showError(
          "Course data is unavailable."
        );

        return;
      }

      let targetLesson = null;
      let targetModule = null;
      let targetModuleIndex = -1;
      let targetLessonIndex = -1;

      /*
       * Find the lesson inside:
       *
       * Course
       *   -> Modules
       *       -> Lessons
       */

      for (
        const module
        of courseDataCache.modules
      ) {

        if (
          !Array.isArray(
            module.lessons
          )
        ) {
          continue;
        }

        const found =
          module.lessons.find(
            lesson =>
              String(
                lesson._id
              ) === String(
                lessonId
              )
          );

        if (found) {

          targetLesson = found;
          targetModule = module;
          targetModuleIndex =
            courseDataCache.modules.indexOf(
              module
            );
          targetLessonIndex =
            module.lessons.indexOf(
              found
            );

          break;

        }

      }

      if (!targetLesson) {

        document.getElementById("quiz-result").innerHTML =
          `<span class="error-text">${miimiidTranslate("lessonNotFound", getSavedLanguage())}</span>`;

        return;
      }

      document
        .getElementById(
          "course-detail-view"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "lesson-view"
        )
        .classList.remove(
          "hidden"
        );

      document
        .getElementById(
          "lesson-title"
        )
        .innerText =
          targetLesson.title ||
          miimiidTranslate("untitledLesson", getSavedLanguage());

      const lessonMeta =
        document.getElementById(
          "lesson-meta"
        );

      const lessonMetaModule =
        document.getElementById(
          "lesson-meta-module"
        );

      const lessonMetaDetails =
        document.getElementById(
          "lesson-meta-details"
        );

      const lessonMetaDescription =
        document.getElementById(
          "lesson-meta-description"
        );

      const totalLessons =
        Array.isArray(
          targetModule.lessons
        )
          ? targetModule.lessons.length
          : 0;

      const lessonNumber =
        targetLessonIndex + 1;

      const duration =
        Number(
          targetLesson.estimatedDuration
        );

      lessonMetaModule.innerText =
        targetModule.title ||
        `Module ${targetModuleIndex + 1}`;

      lessonMetaDetails.innerText =
        `Lesson ${lessonNumber} of ${totalLessons}` +
        (
          duration > 0
            ? ` · ${duration} min`
            : ""
        );

      const description =
        targetLesson.description ||
        "";

      lessonMetaDescription.innerText =
        description;

      lessonMeta.classList.toggle(
        "hidden",
        !description &&
        !(duration > 0) &&
        !targetModule.title
      );

      /*
       * IMPORTANT:
       *
       * Your Lesson model uses
       * contentBlocks.
       *
       * It does NOT use:
       *
       * lesson.content
       */

      renderLessonContent(
        targetLesson.contentBlocks
      );

      renderQuiz(
        targetLesson
      );

      /*
       * Keep the AI Tutor aware of the lesson the learner
       * is currently studying. This is local frontend
       * context only; no OpenAI API call happens here.
       */
      if (typeof setMiimiidAITutorLessonContext === "function") {
        setMiimiidAITutorLessonContext({
          courseId: currentCourseId,
          courseTitle:
            (
              courseDataCache &&
              typeof courseDataCache.title === "string"
            )
              ? courseDataCache.title
              : "",
          moduleTitle:
            targetModule.title || "",
          moduleNumber:
            targetModuleIndex + 1,
          lessonId: targetLesson._id || lessonId,
          lessonTitle:
            targetLesson.title || "",
          lessonDescription:
            targetLesson.description || "",
          contentBlocks:
            Array.isArray(targetLesson.contentBlocks)
              ? targetLesson.contentBlocks
              : [],
          language:
            getSavedLanguage()
        });
      }

      updateLessonNavigation();

    }


    /* =========================================
       RENDER LESSON CONTENT
       ========================================= */

    function renderLessonContent(
      contentBlocks
    ) {

      const container =
        document.getElementById(
          "lesson-content"
        );

      if (
        !Array.isArray(
          contentBlocks
        ) ||
        contentBlocks.length === 0
      ) {

        container.innerHTML = `
          <div class="card">
            <p>
              ${miimiidTranslate("noLessonContent", getSavedLanguage())}
            </p>
          </div>
        `;

        return;
      }

      /*
       * Sort blocks by their database order.
       */

      const blocks =
        [...contentBlocks].sort(
          (a, b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
        );

      container.innerHTML =
        blocks
          .map(
            block =>
              renderContentBlock(
                block
              )
          )
          .join("");

    }


    /* =========================================
       RENDER ONE CONTENT BLOCK
       ========================================= */

    function renderContentBlock(block) {
      // Support rich blocks that store explanatory content in a points array.
      // Some lesson summaries use data.points instead of data.text.
      if (
        block &&
        block.data &&
        Array.isArray(block.data.points) &&
        block.data.points.length > 0 &&
        !block.data.text
      ) {
        block = {
          ...block,
          data: {
            ...block.data,
            text: block.data.points.join("\n\n")
          }
        };
      }



      if (!block) {
        return "";
      }

      const type =
        block.type || "text";

      const data =
        block.data;

      const text =
        getBlockText(data);

      switch (type) {

        case "heading":

          return `
            <div
              class="content-block"
            >

              <h3
                class="content-heading"
              >
                ${escapeHtml(text)}
              </h3>

            </div>
          `;


        case "text":

          return `
            <div
              class="content-block content-text"
            >
              ${escapeHtml(text)}
            </div>
          `;


        case "example":

          return `
            <div
              class="content-block content-example"
            >

              <strong>
                ${miimiidTranslate("example", getSavedLanguage())}
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "callout":

          return `
            <div
              class="content-block content-callout"
            >

              <strong>
                ${miimiidTranslate("important", getSavedLanguage())}
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "formula":

          return `
            <div
              class="content-block content-formula"
            >
              ${escapeHtml(text)}
            </div>
          `;


        case "summary":

          return `
            <div
              class="content-block content-summary"
            >

              <strong>
                ${miimiidTranslate("summary", getSavedLanguage())}
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "image":

          return renderImageBlock(
            data
          );


        case "video":

          return renderVideoBlock(
            data
          );


        case "interactive":

          return `
            <div
              class="content-block card"
            >
              <p>
                ${escapeHtml(text)}
              </p>
            </div>
          `;


        default:

          return `
            <div
              class="content-block"
            >
              <p>
                ${escapeHtml(text)}
              </p>
            </div>
          `;

      }

    }


    /* =========================================
       EXTRACT TEXT FROM CONTENT DATA
       ========================================= */

function getBlockText(data) {

  if (
    data === null ||
    data === undefined
  ) {
    return "";
  }

  if (
    typeof data === "string"
  ) {
    return data;
  }

  if (
    typeof data === "number" ||
    typeof data === "boolean"
  ) {
    return String(data);
  }

  if (
    typeof data === "object"
  ) {

    // Some lesson blocks are stored as:
    // { order: 1, data: { text: "..." } }
    // Unwrap the nested data object first.
    if (
      data.data &&
      typeof data.data === "object"
    ) {
      const nestedText = getBlockText(data.data);

      if (nestedText) {
        return nestedText;
      }
    }

    return (
      data.text ??
      data.content ??
      data.value ??
      data.description ??
      data.body ??
      data.formula ??
      data.equation ??
      data.expression ??
      data.title ??
      ""
    );

  }

  return String(data);
}

    /* =========================================
       IMAGE BLOCK
       ========================================= */

    function renderImageBlock(data) {

      const source =
        getMediaSource(data);

      if (!source) {

        return `
          <div class="content-block">
            <p>
              ${miimiidTranslate('imageUnavailable', getSavedLanguage())}
            </p>
          </div>
        `;

      }

      const alt =
        data &&
        typeof data === "object"
          ? (
              data.alt ||
              data.caption ||
              miimiidTranslate('lessonImage', getSavedLanguage())
            )
          : miimiidTranslate('lessonImage', getSavedLanguage());

const caption =
        data &&
        typeof data === "object"
          ? data.caption || ""
          : "";

      return `

        <div class="content-block">

          <img
            class="content-image"
            src="${escapeAttribute(source)}"
            alt="${escapeAttribute(alt)}"
            loading="lazy"
          >

          ${
            caption
              ? `
                <div class="content-caption">
                  ${escapeHtml(caption)}
                </div>
              `
              : ""
          }

        </div>

      `;

    }


    /* =========================================
   VIDEO BLOCK
   ========================================= */

function renderVideoBlock(data) {

  const source =
    getMediaSource(data);

  if (!source) {

    return `
      <div class="content-block">
        <p>
          ${miimiidTranslate('videoUnavailable', getSavedLanguage())}
        </p>
      </div>
    `;

  }

  return `

    <div class="content-block">

      <div class="video-wrapper">

        <video
          class="content-video"
          controls
          preload="metadata"
          playsinline
        >

          <source
            src="${escapeAttribute(source)}"
          >

          ${miimiidTranslate('browserVideoUnsupported', getSavedLanguage())}

        </video>

        <div class="video-watermark">
          Miimiid AI Tutor
        </div>

      </div>

    </div>

  `;

}


    /* =========================================
       GET MEDIA URL
       ========================================= */

    function getMediaSource(data) {

      if (
        typeof data === "string"
      ) {
        return data;
      }

      if (
        !data ||
        typeof data !== "object"
      ) {
        return "";
      }

      return (
        data.url ||
        data.src ||
        data.source ||
        data.href ||
        ""
      );

    }


    /* =========================================
       QUIZ
       ========================================= */

function renderQuiz(lesson) {

  const section =
    document.getElementById("quiz-section");

  const question =
    document.getElementById("quiz-question");

  const options =
    document.getElementById("quiz-options");

  const result =
    document.getElementById("quiz-result");

  result.innerHTML = "";

  currentQuizzes =
    Array.isArray(lesson.quizzes)
      ? lesson.quizzes
      : [];

  selectedQuizAnswers =
    new Array(currentQuizzes.length);

  quizSubmitted = false;

  if (currentQuizzes.length === 0) {

    section.classList.add("hidden");
    options.innerHTML = "";

    return;
  }

  section.classList.remove("hidden");

  /*
   * Render every question according
   * to its question type.
   */
  options.innerHTML =
    currentQuizzes
      .map((quiz, quizIndex) => {

        const questionType =
          quiz.questionType || "multiple-choice";

        /*
         * -----------------------------------------
         * MULTIPLE-CHOICE / TRUE-FALSE
         * -----------------------------------------
         */
        if (
          questionType === "multiple-choice" ||
          questionType === "true-false"
        ) {

          const quizOptions =
            Array.isArray(quiz.options)
              ? quiz.options
              : [];

          return `
            <div
              class="card"
              style="margin-top: 15px;"
            >

              <p>
                <strong>
                  ${quizIndex + 1}.
                  ${escapeHtml(
                    quiz.question ||
                    miimiidTranslate("questionUnavailable", getSavedLanguage())
                  )}
                </strong>
              </p>

              ${
                quizOptions.length > 0

                  ? quizOptions
                      .map(
                        (option, optionIndex) => `
                          <label
                            class="quiz-option"
                          >

                            <input
                              type="radio"
                              name="quiz-${quizIndex}"
                              value="${optionIndex}"
                              onchange="
                                selectedQuizAnswers[${quizIndex}]
                                = ${optionIndex};
                              "
                            >

                            ${escapeHtml(option)}

                          </label>
                        `
                      )
                      .join("")

                  : `
                    <p class="error-text">
                      ${miimiidTranslate('noAnswerOptions', getSavedLanguage())}
                    </p>
                  `
              }

            </div>
          `;
        }

        /*
         * -----------------------------------------
         * CALCULATION QUESTION
         * -----------------------------------------
         */
        if (questionType === "calculate") {

          return `
            <div
              class="card"
              style="margin-top: 15px;"
            >

              <p>
                <strong>
                  ${quizIndex + 1}.
                  ${escapeHtml(
                    quiz.question ||
                    miimiidTranslate('calculationQuestionUnavailable', getSavedLanguage())
                  )}
                </strong>
              </p>

              <label>
                <strong>
                  ${miimiidTranslate('yourAnswer', getSavedLanguage())}:
                </strong>
              </label>

               <input
               type="number"
               class="quiz-option calculation-input"
               id="calculation-answer-${quizIndex}"
                placeholder="${miimiidTranslate('enterYourAnswer', getSavedLanguage())}"
                step="any"
                oninput="
                  selectedQuizAnswers[${quizIndex}]
                  = this.value;
                "
              >

              ${
                quiz.hint
                  ? `
                    <p>
                      <small>
                        ${miimiidTranslate('hint', getSavedLanguage())}:
                        ${escapeHtml(quiz.hint)}
                      </small>
                    </p>
                  `
                  : ""
              }

            </div>
          `;
        }

        /*
         * -----------------------------------------
         * UNKNOWN QUESTION TYPE
         * -----------------------------------------
         */
        return `
          <div
            class="card"
            style="margin-top: 15px;"
          >

            <p>
              <strong>
                ${quizIndex + 1}.
                ${escapeHtml(
                  quiz.question ||
                  miimiidTranslate("questionUnavailable", getSavedLanguage())
                )}
              </strong>
            </p>

            <p class="error-text">
              ${miimiidTranslate("unsupportedQuestionType", getSavedLanguage())}
              ${escapeHtml(questionType)}
            </p>

          </div>
        `;

      })
      .join("");

  question.innerText =
    miimiidTranslate(
      "questionInstruction",
      getSavedLanguage()
    );
}

    /* =========================================
       SUBMIT QUIZ
       ========================================= */

async function submitQuiz() {

  if (
    !currentLessonId ||
    currentQuizzes.length === 0
  ) {

    const result =
      document.getElementById("quiz-result");

    result.innerHTML = `
      <span class="error-text">
        ${miimiidTranslate("noQuizAvailable", getSavedLanguage())}
      </span>
    `;

    return;
  }

  /*
   * Make sure every question has an answer.
   */
  const unanswered =
    currentQuizzes.findIndex(
      (quiz, index) => {

        const answer =
          selectedQuizAnswers[index];

        if (
          answer === undefined ||
          answer === null ||
          answer === ""
        ) {
          return true;
        }

        return false;
      }
    );

  if (unanswered !== -1) {

    const result =
      document.getElementById("quiz-result");

    result.innerHTML = `
      <span class="error-text">
        ${miimiidTranslate("answerAllQuestions", getSavedLanguage())}
      </span>
    `;

    return;
  }

  /*
   * Convert calculation answers
   * from strings to numbers.
   *
   * Multiple-choice and true-false
   * answers remain option indexes.
   */
  const answersForSubmission =
    currentQuizzes.map(
      (quiz, index) => {

        if (
          quiz.questionType === "calculate"
        ) {

          return Number(
            selectedQuizAnswers[index]
          );

        }

        return selectedQuizAnswers[index];

      }
    );

  const button =
    document.getElementById(
      "quiz-submit-btn"
    );

  const result =
    document.getElementById(
      "quiz-result"
    );

  button.disabled = true;
  button.innerText = miimiidTranslate("checking", getSavedLanguage());

  try {

    const response =
      await fetch(
        "/api/learn/quiz/submit",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            lessonId:
              currentLessonId,

            submittedAnswers:
              answersForSubmission

          })
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.status === "success"
    ) {

      const quizResult =
        data.data;

      if (quizResult.passed) {

        result.innerHTML = `
          <span class="success-text">
            ${miimiidTranslate("quizComplete", getSavedLanguage())}
            ${miimiidTranslate("score", getSavedLanguage())}: ${quizResult.score}%.
            ${miimiidTranslate("youGot", getSavedLanguage())}
            ${quizResult.correctAnswers}
            ${miimiidTranslate("outOf", getSavedLanguage())}
            ${quizResult.totalQuestions}
            ${miimiidTranslate("correct", getSavedLanguage())}
            ${miimiidTranslate("canCompleteLesson", getSavedLanguage())}
          </span>
        `;

        quizSubmitted = true;

      } else {

        result.innerHTML = `
          <span class="error-text">
            ${miimiidTranslate("score", getSavedLanguage())}: ${quizResult.score}%.
            ${miimiidTranslate("youGot", getSavedLanguage())}
            ${quizResult.correctAnswers}
            ${miimiidTranslate("outOf", getSavedLanguage())}
            ${quizResult.totalQuestions}
            ${miimiidTranslate("correct", getSavedLanguage())}
            ${miimiidTranslate("reviewLessonTryAgain", getSavedLanguage())}
          </span>
        `;

        quizSubmitted = false;
      }

    } else {

      result.innerHTML = `
        <span class="error-text">
          ${
            data.message ||
            miimiidTranslate(
              "unableToValidateQuiz",
              getSavedLanguage()
            )
          }
        </span>
      `;

    }

  } catch (error) {

    console.error(
      "Quiz submission error:",
      error
    );

    result.innerHTML = `
      <span class="error-text">
        ${miimiidTranslate("unableToConnect", getSavedLanguage())}
      </span>
    `;

  } finally {

    button.disabled = false;
    button.innerText =
      miimiidTranslate(
        "submitAnswer",
        getSavedLanguage()
      );

  }
}

    /* =========================================
       LESSON NAVIGATION
       ========================================= */

    function updateLessonNavigation() {

      const navigation =
        document.getElementById(
          "lesson-navigation"
        );

      const previousButton =
        document.getElementById(
          "previous-lesson-btn"
        );

      const nextButton =
        document.getElementById(
          "next-lesson-btn"
        );

      if (
        !navigation ||
        !previousButton ||
        !nextButton ||
        !courseDataCache ||
        !Array.isArray(
          courseDataCache.modules
        )
      ) {
        return;
      }

      const allLessons = [];

      courseDataCache.modules.forEach(
        module => {

          if (
            !Array.isArray(
              module.lessons
            )
          ) {
            return;
          }

          module.lessons.forEach(
            lesson => {
              allLessons.push(lesson);
            }
          );

        }
      );

      const currentIndex =
        allLessons.findIndex(
          lesson =>
            String(
              lesson._id
            ) === String(
              currentLessonId
            )
        );

      if (currentIndex === -1) {
        navigation.classList.add(
          "hidden"
        );
        return;
      }

      const hasPrevious =
        currentIndex > 0;

      const hasNext =
        currentIndex <
        allLessons.length - 1;

      previousButton.classList.toggle(
        "hidden",
        !hasPrevious
      );

      nextButton.classList.toggle(
        "hidden",
        !hasNext
      );

      navigation.classList.toggle(
        "hidden",
        !hasPrevious &&
        !hasNext
      );
    }


    function navigateToLesson(
      direction
    ) {

      if (
        !courseDataCache ||
        !Array.isArray(
          courseDataCache.modules
        )
      ) {
        return;
      }

      const allLessons = [];

      courseDataCache.modules.forEach(
        module => {

          if (
            !Array.isArray(
              module.lessons
            )
          ) {
            return;
          }

          module.lessons.forEach(
            lesson => {
              allLessons.push(lesson);
            }
          );

        }
      );

      const currentIndex =
        allLessons.findIndex(
          lesson =>
            String(
              lesson._id
            ) === String(
              currentLessonId
            )
        );

      if (currentIndex === -1) {
        return;
      }

      let targetIndex =
        currentIndex;

      if (
        direction === "previous"
      ) {
        targetIndex =
          currentIndex - 1;
      } else if (
        direction === "next"
      ) {
        targetIndex =
          currentIndex + 1;
      }

      if (
        targetIndex < 0 ||
        targetIndex >=
          allLessons.length
      ) {
        return;
      }

      const targetLesson =
        allLessons[targetIndex];

      if (!targetLesson) {
        return;
      }

      openLesson(
        targetLesson._id
      );
    }


    /* =========================================
       COMPLETE LESSON
       ========================================= */

    async function completeLesson() {

  if (!currentLessonId) {

    document.getElementById("quiz-result").innerHTML =
      `<span class="error-text">${miimiidTranslate("noLessonSelected", getSavedLanguage())}</span>`;

    return;
  }

  /*
   * If the lesson has quizzes,
   * require the quiz to be submitted first.
   */
  if (
    currentQuizzes.length > 0 &&
    !quizSubmitted
  ) {

    document.getElementById("quiz-result").innerHTML =
      `<span class="error-text">${miimiidTranslate("submitQuizFirst", getSavedLanguage())}</span>`;

    return;
  }

  const button =
    document.getElementById(
      "complete-btn"
    );

  button.disabled = true;

  button.innerText =
    miimiidTranslate("saving", getSavedLanguage());

  try {

    const response =
      await fetch(
        `/api/learn/lessons/${currentLessonId}/complete`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            userId:
              getMiimiidCurrentUserId(),

            submittedAnswers:
              selectedQuizAnswers

          })
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.status === "success"
    ) {

      document.getElementById("quiz-result").innerHTML =
        `<span class="success-text">${miimiidTranslate("lessonCompletedSuccessfully", getSavedLanguage())}</span>`;

      /*
       * Reload the course so the
       * frontend has fresh data.
       */
      await openCourse(
        currentCourseId
      );

    } else {

      document.getElementById("quiz-result").innerHTML =
        `<span class="error-text">${data.message || miimiidTranslate("failedToSaveProgress", getSavedLanguage())}</span>`;

    }

  } catch (error) {

    console.error(
      "Complete lesson error:",
      error
    );

    document.getElementById("quiz-result").innerHTML =
      `<span class="error-text">${miimiidTranslate(
        "failedToSaveProgress",
        getSavedLanguage()
      )}</span>`;

  } finally {

    button.disabled = false;

    button.innerText =
      miimiidTranslate(
        "completeLesson",
        getSavedLanguage()
      );
  }
}

    /* =========================================
       LOADING
       ========================================= */

    function showLoading(isLoading) {

      const loading =
        document.getElementById(
          "loading"
        );

      if (isLoading) {

        loading.classList.remove(
          "hidden"
        );

      } else {

        loading.classList.add(
          "hidden"
        );

      }

    }


    /* =========================================
       ERROR
       ========================================= */

    function showError(message) {

      const error =
        document.getElementById(
          "error"
        );

      error.innerText =
        message ||
        miimiidTranslate(
          "somethingWentWrong",
          getSavedLanguage()
        );

      error.classList.remove(
        "hidden"
      );

    }


    function hideError() {

      document
        .getElementById(
          "error"
        )
        .classList.add(
          "hidden"
        );

    }


    /* =========================================
       HTML ESCAPING
       ========================================= */

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value === null ||
        value === undefined
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function escapeAttribute(value) {

      return escapeHtml(
        value
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#39;"
      );

    }

<script>

  /*
   * =========================================
   * LANGUAGE CHANGE REFRESH
   * =========================================
   */

  document.addEventListener(
    "miimiidLanguageChanged",
    async () => {

      const language =
        getSavedLanguage();

      /*
       * =====================================================
       * MIIMIID DYNAMIC LOCALIZATION REFRESH
       * =====================================================
       *
       * Every visible surface must be rebuilt from its
       * existing data/state. No hardcoded replacement UI
       * is introduced here.
       */

      document.documentElement.lang =
        language;

      /*
       * Dashboard
       *
       * Re-render the existing dashboard registry and data
       * so navigation labels, statistics, and drawer labels
       * immediately use the selected language.
       */
      renderMiimiidBottomNavigation();

      if (
        typeof renderMiimiidDashboard === "function" &&
        miimiidDashboardData
      ) {
        renderMiimiidDashboard();
      } else {
        renderMiimiidDashboardMenu();
      }

      /*
       * Learning state.
       *
       * Preserve the learner's current course and lesson
       * before refreshing translated course data.
       */
      const courseId =
        currentCourseId;

      const lessonId =
        currentLessonId;

      const courseList =
        document.getElementById(
          "course-list-view"
        );

      const courseDetail =
        document.getElementById(
          "course-detail-view"
        );

      const lessonView =
        document.getElementById(
          "lesson-view"
        );

      /*
       * If the learner is currently browsing the course
       * list, reload the real course data in the selected
       * language.
       */
      if (
        courseList &&
        !courseList.classList.contains("hidden")
      ) {
        await fetchCourses();
        return;
      }

      /*
       * If a real course is open, reload its complete
       * translated tree.
       */
      if (courseId) {

        await openCourse(
          courseId
        );

        /*
         * Restore the exact lesson only when the learner
         * was actually inside one.
         */
        if (
          lessonId &&
          lessonView
        ) {
          openLesson(
            lessonId
          );
        }

        return;
      }

      /*
       * If no course is active, still ensure the static
       * translation layer has been applied to the existing
       * shell.
       */
      applyMiimiidTranslations(
        language
      );
    }
  );

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeLanguageSelector
    );
  } else {
    initializeLanguageSelector();
  }

  if (document.readyState === "loading") {
  document.addEventListener(
    "DOMContentLoaded",
    initializeMiimiidApplication
  );
} else {
  initializeMiimiidApplication();
  }
  
    /*

 */

</script>
