<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Platform - Financial Operating System</title>
    <style>
        /* --- DESIGN TOKENS & SYSTEM --- */
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-success: #22c55e;
            --border-color: #334155;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 24px;
            --spacing-xl: 48px;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

    body {
    background-color: var(--bg-primary);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden; 
}

        }

        /* --- APP CONTAINER (Mobile & Web Adaptive Shell) --- */
        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- HEADER --- */
        header {
            padding: var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        /* --- DYNAMIC VIEWPORT AREA --- */
        #main-viewport {
    flex: 1;
    overflow-y: auto;
    padding: var(--spacing-lg);
    padding-bottom: 100px;
}       

        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-md) 0;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-primary);
        }

        /* --- REUSABLE COMPONENTS --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .metric-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: var(--spacing-xs);
        }

        .sub-text {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Top App Header -->
        <header>
            <h1 id="app-title">Dashboard</h1>
            <span class="sub-text" id="user-status">Online Sync</span>
        </header>

        <!-- Main Viewport where screens render cleanly without overlap -->
        <main id="main-viewport">
            <!-- Initial home screen view injection point -->
        </main>

        <!-- Bottom Navigation Shell -->
        <nav>
            <button class="nav-item active" onclick="app.switchTab('home')">
                <span>🏠</span> Home
            </button>
            <button class="nav-item" onclick="app.switchTab('money')">
                <span>💳</span> Money
            </button>
            <button class="nav-item" onclick="app.switchTab('learn')">
                <span>📚</span> Learn
            </button>
            <button class="nav-item" onclick="app.switchTab('market')">
                <span>🛒</span> Market
            </button>
            <button class="nav-item" onclick="app.switchTab('community')">
                <span>👥</span> Community
            </button>
        </nav>
    </div>

<script src="/js/learnRenderer.js"></script>
<script src="/js/marketplaceRenderer.js"></script>
<script src="app.js"></script>
</body>
</html>
