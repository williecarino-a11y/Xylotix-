<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylotix - Financial Academy</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 15px;
      margin: 0;
    }

    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    h2 {
      color: #38bdf8;
      margin-top: 15px;
    }

    h3 {
      color: #f1f5f9;
      margin-top: 0;
    }

    p {
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow-wrap: break-word;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-sm {
      width: auto;
      padding: 7px 12px;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .hidden {
      display: none !important;
    }

    #loading {
      color: #38bdf8;
      font-weight: bold;
      margin: 15px 0;
    }

    #error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
      padding: 12px;
      border-radius: 6px;
      margin: 15px 0;
    }

    .success-text {
      color: #4ade80;
      font-weight: bold;
    }

    .error-text {
      color: #f87171;
      font-weight: bold;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lesson-row span {
      flex: 1;
      min-width: 150px;
    }

    /* ================================
       LESSON CONTENT
       ================================ */

    #lesson-content {
      margin-top: 20px;
    }

    .content-block {
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .content-heading {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .content-text {
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .content-example {
      background: #172554;
      border-left: 4px solid #38bdf8;
      padding: 14px;
      border-radius: 6px;
    }

    .content-callout {
      background: #422006;
      border-left: 4px solid #f59e0b;
      padding: 14px;
      border-radius: 6px;
    }

    .content-formula {
      background: #020617;
      padding: 14px;
      border-radius: 6px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .content-summary {
      background: #052e16;
      border-left: 4px solid #4ade80;
      padding: 14px;
      border-radius: 6px;
    }

    .content-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
    }

    .content-video {
      display: block;
      width: 100%;
      max-width: 800px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .content-caption {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* ================================
       QUIZ
       ================================ */

    .quiz-option {
      display: block;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .quiz-option:hover {
      border-color: #38bdf8;
    }

    .quiz-option input {
      margin-right: 8px;
    }
  </style></head><body>  <h1>Xylotix Financial Academy</h1>  <div id="loading" class="hidden">
    Loading...
  </div>  <div id="error" class="hidden"></div>  <!-- ================================
       COURSE LIST
       ================================ -->  <div id="course-list-view"><p>
  Select a course to explore modules and lessons:
</p>

<div id="courses-container"></div>

  </div>  <!-- ================================
       COURSE DETAILS
       ================================ -->  <div id="course-detail-view" class="hidden"><button
  class="btn btn-sm"
  onclick="goBackToCourses()"
>
  ← Back to Courses
</button>

<h2 id="detail-course-title"></h2>

<p id="detail-course-desc"></p>

<div id="modules-container"></div>

  </div>  <!-- ================================
       LESSON VIEW
       ================================ -->  <div id="lesson-view" class="card hidden"><button
  class="btn btn-sm"
  onclick="backToModules()"
>
  ← Back to Course Modules
</button>

<h2 id="lesson-title"></h2>

<div id="lesson-content"></div>

<!-- QUIZ -->

<div id="quiz-section" class="hidden">

  <h3>Quick Check</h3>

  <p id="quiz-question"></p>

  <div id="quiz-options"></div>

  <button
    id="quiz-submit-btn"
    class="btn"
    onclick="submitQuiz()"
  >
    Submit Answer
  </button>

  <p id="quiz-result"></p>

</div>

<!-- COMPLETE LESSON -->

<button
  id="complete-btn"
  class="btn"
  onclick="completeLesson()"
>
  Complete Lesson
</button>

  </div>  <script>

    /* =========================================
       APPLICATION STATE
       ========================================= */

    let currentQuizzes = [];
    let selectedQuizAnswers = [];
    let quizSubmitted = false;
    let currentLessonId = null;
    let currentQuiz = null;
    let courseDataCache = null;

    /*
     * Temporary user ID.
     * This should eventually come from authentication.
     */
    const dummyUserId = "648fc928d566fb4c30676e11";


    /* =========================================
       FETCH ALL COURSES
       ========================================= */

    async function fetchCourses() {

      showLoading(true);
      hideError();

      try {

        const response = await fetch(
          "/api/learn/courses"
        );

        const data = await response.json();

        showLoading(false);

        const container =
          document.getElementById(
            "courses-container"
          );

        /*
         * Support both possible backend formats:
         *
         * {
         *   status: "success",
         *   data: [...]
         * }
         *
         * OR
         *
         * {
         *   success: true,
         *   courses: [...]
         * }
         */

        const courses =
          Array.isArray(data.data)
            ? data.data
            : Array.isArray(data.courses)
              ? data.courses
              : [];

        if (
          response.ok &&
          courses.length > 0
        ) {

          container.innerHTML =
            courses.map(course => `

              <div class="card">

                <h3>
                  ${escapeHtml(
                    course.title ||
                    "Untitled Course"
                  )}
                </h3>

                <p>
                  ${escapeHtml(
                    course.description ||
                    "No description available."
                  )}
                </p>

                <button
                  class="btn"
                  onclick="openCourse('${course._id}')"
                >
                  Open Course
                </button>

              </div>

            `).join("");

        } else {

          container.innerHTML = `
            <p>
              No courses found in database.
            </p>
          `;

        }

      } catch (error) {

        showLoading(false);

        console.error(
          "fetchCourses error:",
          error
        );

        showError(
          "Unable to load courses."
        );

      }

    }


    /* =========================================
       OPEN COURSE
       ========================================= */

    async function openCourse(courseId) {

      if (!courseId) {

        showError(
          "Invalid course ID."
        );

        return;
      }

      currentCourseId = courseId;

      showLoading(true);
      hideError();

      try {

        const response = await fetch(
          `/api/learn/courses/${courseId}`
        );

        const data = await response.json();

        showLoading(false);

        /*
         * Support both:
         *
         * data.data
         *
         * and
         *
         * data.course
         */

        const course =
          data.data ||
          data.course ||
          null;

        if (
          response.ok &&
          course
        ) {

          courseDataCache = course;

          document
            .getElementById(
              "course-list-view"
            )
            .classList.add(
              "hidden"
            );

          document
            .getElementById(
              "lesson-view"
            )
            .classList.add(
              "hidden"
            );

          document
            .getElementById(
              "course-detail-view"
            )
            .classList.remove(
              "hidden"
            );

          document
            .getElementById(
              "detail-course-title"
            )
            .innerText =
              course.title ||
              "Untitled Course";

          document
            .getElementById(
              "detail-course-desc"
            )
            .innerText =
              course.description ||
              "No description available.";

          renderModules(
            course.modules
          );

        } else {

          console.error(
            "Course loading failed:",
            data
          );

          showError(
            data.message ||
            "Unable to load course."
          );

        }

      } catch (error) {

        showLoading(false);

        console.error(
          "openCourse error:",
          error
        );

        showError(
          "Unable to connect to the server."
        );

      }

    }


    /* =========================================
       RENDER MODULES
       ========================================= */

    function renderModules(modules) {

      const container =
        document.getElementById(
          "modules-container"
        );

      if (
        !Array.isArray(modules) ||
        modules.length === 0
      ) {

        container.innerHTML = `
          <div class="card">
            <p>
              No modules are available yet.
            </p>
          </div>
        `;

        return;
      }

      container.innerHTML =
        modules.map(
          (module, moduleIndex) => {

            const lessons =
              Array.isArray(
                module.lessons
              )
                ? module.lessons
                : [];

            return `

              <div class="card">

                <h3>
                  Module ${moduleIndex + 1}:
                  ${escapeHtml(
                    module.title ||
                    "Untitled Module"
                  )}
                </h3>

                ${
                  lessons.length === 0

                    ? `
                      <p>
                        No lessons available
                        in this module yet.
                      </p>
                    `

                    : `
                      <ul>

                        ${
                          lessons.map(
                            lesson => `

                              <li>

                                <div
                                  class="lesson-row"
                                >

                                  <span>
                                    ${escapeHtml(
                                      lesson.title ||
                                      "Untitled Lesson"
                                    )}
                                  </span>

                                  <button
                                    class="btn btn-sm"
                                    onclick="openLesson('${lesson._id}')"
                                  >
                                    Start Lesson
                                  </button>

                                </div>

                              </li>

                            `
                          ).join("")
                        }

                      </ul>
                    `
                }

              </div>

            `;

          }
        ).join("");

    }


    /* =========================================
       OPEN LESSON
       ========================================= */

    function openLesson(lessonId) {

      currentLessonId = lessonId;

      if (
        !courseDataCache ||
        !Array.isArray(
          courseDataCache.modules
        )
      ) {

        showError(
          "Course data is unavailable."
        );

        return;
      }

      let targetLesson = null;

      /*
       * Find the lesson inside:
       *
       * Course
       *   -> Modules
       *       -> Lessons
       */

      for (
        const module
        of courseDataCache.modules
      ) {

        if (
          !Array.isArray(
            module.lessons
          )
        ) {
          continue;
        }

        const found =
          module.lessons.find(
            lesson =>
              String(
                lesson._id
              ) === String(
                lessonId
              )
          );

        if (found) {

          targetLesson = found;

          break;

        }

      }

      if (!targetLesson) {

        alert(
          "Lesson not found."
        );

        return;
      }

      document
        .getElementById(
          "course-detail-view"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "lesson-view"
        )
        .classList.remove(
          "hidden"
        );

      document
        .getElementById(
          "lesson-title"
        )
        .innerText =
          targetLesson.title ||
          "Untitled Lesson";

      /*
       * IMPORTANT:
       *
       * Your Lesson model uses
       * contentBlocks.
       *
       * It does NOT use:
       *
       * lesson.content
       */

      renderLessonContent(
        targetLesson.contentBlocks
      );

      renderQuiz(
        targetLesson
      );

    }


    /* =========================================
       RENDER LESSON CONTENT
       ========================================= */

    function renderLessonContent(
      contentBlocks
    ) {

      const container =
        document.getElementById(
          "lesson-content"
        );

      if (
        !Array.isArray(
          contentBlocks
        ) ||
        contentBlocks.length === 0
      ) {

        container.innerHTML = `
          <div class="card">
            <p>
              No lesson content available.
            </p>
          </div>
        `;

        return;
      }

      /*
       * Sort blocks by their database order.
       */

      const blocks =
        [...contentBlocks].sort(
          (a, b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
        );

      container.innerHTML =
        blocks
          .map(
            block =>
              renderContentBlock(
                block
              )
          )
          .join("");

    }


    /* =========================================
       RENDER ONE CONTENT BLOCK
       ========================================= */

    function renderContentBlock(block) {

      if (!block) {
        return "";
      }

      const type =
        block.type || "text";

      const data =
        block.data;

      const text =
        getBlockText(data);

      switch (type) {

        case "heading":

          return `
            <div
              class="content-block"
            >

              <h3
                class="content-heading"
              >
                ${escapeHtml(text)}
              </h3>

            </div>
          `;


        case "text":

          return `
            <div
              class="content-block content-text"
            >
              ${escapeHtml(text)}
            </div>
          `;


        case "example":

          return `
            <div
              class="content-block content-example"
            >

              <strong>
                Example
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "callout":

          return `
            <div
              class="content-block content-callout"
            >

              <strong>
                Important
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "formula":

          return `
            <div
              class="content-block content-formula"
            >
              ${escapeHtml(text)}
            </div>
          `;


        case "summary":

          return `
            <div
              class="content-block content-summary"
            >

              <strong>
                Summary
              </strong>

              <p>
                ${escapeHtml(text)}
              </p>

            </div>
          `;


        case "image":

          return renderImageBlock(
            data
          );


        case "video":

          return renderVideoBlock(
            data
          );


        case "interactive":

          return `
            <div
              class="content-block card"
            >
              <p>
                ${escapeHtml(text)}
              </p>
            </div>
          `;


        default:

          return `
            <div
              class="content-block"
            >
              <p>
                ${escapeHtml(text)}
              </p>
            </div>
          `;

      }

    }


    /* =========================================
       EXTRACT TEXT FROM CONTENT DATA
       ========================================= */

    function getBlockText(data) {

      if (
        data === null ||
        data === undefined
      ) {
        return "";
      }

      if (
        typeof data === "string"
      ) {
        return data;
      }

      if (
        typeof data === "number" ||
        typeof data === "boolean"
      ) {
        return String(data);
      }

      if (
        typeof data === "object"
      ) {

        return (
          data.text ??
          data.content ??
          data.value ??
          data.description ??
          data.body ??
          ""
        );

      }

      return String(data);

    }


    /* =========================================
       IMAGE BLOCK
       ========================================= */

    function renderImageBlock(data) {

      const source =
        getMediaSource(data);

      if (!source) {

        return `
          <div class="content-block">
            <p>
              Image unavailable.
            </p>
          </div>
        `;

      }

      const alt =
        data &&
        typeof data === "object"
          ? (
              data.alt ||
              data.caption ||
              "Lesson image"
            )
          : "Lesson image";

const caption =
        data &&
        typeof data === "object"
          ? data.caption || ""
          : "";

      return `

        <div class="content-block">

          <img
            class="content-image"
            src="${escapeAttribute(source)}"
            alt="${escapeAttribute(alt)}"
            loading="lazy"
          >

          ${
            caption
              ? `
                <div class="content-caption">
                  ${escapeHtml(caption)}
                </div>
              `
              : ""
          }

        </div>

      `;

    }


    /* =========================================
       VIDEO BLOCK
       ========================================= */

    function renderVideoBlock(data) {

      const source =
        getMediaSource(data);

      if (!source) {

        return `
          <div class="content-block">
            <p>
              Video unavailable.
            </p>
          </div>
        `;

      }

      return `

        <div class="content-block">

          <video
            class="content-video"
            controls
            preload="metadata"
          >

            <source
              src="${escapeAttribute(source)}"
            >

            Your browser does not support
            video playback.

          </video>

        </div>

      `;

    }


    /* =========================================
       GET MEDIA URL
       ========================================= */

    function getMediaSource(data) {

      if (
        typeof data === "string"
      ) {
        return data;
      }

      if (
        !data ||
        typeof data !== "object"
      ) {
        return "";
      }

      return (
        data.url ||
        data.src ||
        data.source ||
        data.href ||
        ""
      );

    }


    /* =========================================
       QUIZ
       ========================================= */

     function renderQuiz(lesson) {

  const section =
    document.getElementById(
      "quiz-section"
    );

  const question =
    document.getElementById(
      "quiz-question"
    );

  const options =
    document.getElementById(
      "quiz-options"
    );

  const result =
    document.getElementById(
      "quiz-result"
    );

  result.innerHTML = "";

  currentQuizzes =
    Array.isArray(lesson.quizzes)
      ? lesson.quizzes
      : [];

  selectedQuizAnswers =
    new Array(currentQuizzes.length);

  quizSubmitted = false;

  if (currentQuizzes.length === 0) {

    section.classList.add(
      "hidden"
    );

    options.innerHTML = "";

    return;
  }

  section.classList.remove(
    "hidden"
  );

  /*
   * Render all quizzes belonging
   * to this lesson.
   */
  options.innerHTML =
    currentQuizzes
      .map(
        (quiz, quizIndex) => {

          const quizOptions =
            Array.isArray(
              quiz.options
            )
              ? quiz.options
              : [];

          return `
            <div
              class="card"
              style="margin-top: 15px;"
            >

              <p>
                <strong>
                  ${quizIndex + 1}.
                  ${escapeHtml(
                    quiz.question ||
                    "Question unavailable."
                  )}
                </strong>
              </p>

              ${
                quizOptions
                  .map(
                    (option, optionIndex) => `
                      <label
                        class="quiz-option"
                      >

                        <input
                          type="radio"
                          name="quiz-${quizIndex}"
                          value="${optionIndex}"
                          onchange="
                            selectedQuizAnswers[${quizIndex}]
                            = ${optionIndex};
                          "
                        >

                        ${escapeHtml(option)}

                      </label>
                    `
                  )
                  .join("")
              }

            </div>
          `;
        }
      )
      .join("");

  question.innerText =
    "Answer the questions below before completing the lesson.";
}


    /* =========================================
       SUBMIT QUIZ
       ========================================= */

    async function submitQuiz() {

  if (
    !currentLessonId ||
    currentQuizzes.length === 0
  ) {
    alert(
      "No quiz is available."
    );

    return;
  }

  /*
   * Make sure every quiz has
   * an answer.
   */
  const unanswered =
    currentQuizzes.findIndex(
      (_, index) =>
        selectedQuizAnswers[index] ===
        undefined
    );

  if (unanswered !== -1) {

    alert(
      `Please answer question ${
        unanswered + 1
      } before submitting.`
    );

    return;
  }

  const button =
    document.getElementById(
      "quiz-submit-btn"
    );

  const result =
    document.getElementById(
      "quiz-result"
    );

  button.disabled = true;
  button.innerText =
    "Checking...";

  try {

    const response =
      await fetch(
        "/api/learn/quiz/submit",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            lessonId:
              currentLessonId,

            submittedAnswers:
              selectedQuizAnswers
          })
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.status === "success"
    ) {

      const quizResult =
        data.data;

      if (
        quizResult.passed
      ) {

        result.innerHTML = `
          <span class="success-text">
            Quiz complete! 
            Score: ${quizResult.score}%.
            You got
            ${quizResult.correctAnswers}
            out of
            ${quizResult.totalQuestions}
            correct.
            You can now complete the lesson.
          </span>
        `;

        quizSubmitted = true;

      } else {

        result.innerHTML = `
          <span class="error-text">
            Score: ${quizResult.score}%.
            You got
            ${quizResult.correctAnswers}
            out of
            ${quizResult.totalQuestions}
            correct.
            Review the lesson and try again.
          </span>
        `;

        quizSubmitted = false;
      }

    } else {

      result.innerHTML = `
        <span class="error-text">
          ${
            data.message ||
            "Unable to validate quiz."
          }
        </span>
      `;

    }

  } catch (error) {

    console.error(
      "Quiz submission error:",
      error
    );

    result.innerHTML = `
      <span class="error-text">
        Unable to connect to the server.
      </span>
    `;

  } finally {

    button.disabled = false;
    button.innerText =
      "Submit Answer";

  }
}


    /* =========================================
       COMPLETE LESSON
       ========================================= */

    async function completeLesson() {

  if (!currentLessonId) {

    alert(
      "No lesson is currently selected."
    );

    return;
  }

  /*
   * If the lesson has quizzes,
   * require the quiz to be submitted first.
   */
  if (
    currentQuizzes.length > 0 &&
    !quizSubmitted
  ) {

    alert(
      "Please complete and submit the quiz before completing this lesson."
    );

    return;
  }

  const button =
    document.getElementById(
      "complete-btn"
    );

  button.disabled = true;

  button.innerText =
    "Saving...";

  try {

    const response =
      await fetch(
        `/api/learn/lessons/${currentLessonId}/complete`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            userId:
              dummyUserId,

            submittedAnswers:
              selectedQuizAnswers

          })
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.status === "success"
    ) {

      alert(
        "Lesson completed successfully!"
      );

      /*
       * Reload the course so the
       * frontend has fresh data.
       */
      await openCourse(
        currentCourseId
      );

    } else {

      alert(
        data.message ||
        "Failed to save lesson progress."
      );

    }

  } catch (error) {

    console.error(
      "Complete lesson error:",
      error
    );

    alert(
      "Failed to save progress."
    );

  } finally {

    button.disabled = false;

    button.innerText =
      "Complete Lesson";
  }
}


    /* =========================================
       BACK TO MODULES
       ========================================= */

    function backToModules() {

      document
        .getElementById(
          "lesson-view"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "course-detail-view"
        )
        .classList.remove(
          "hidden"
        );

    }


    /* =========================================
       BACK TO COURSES
       ========================================= */

    function goBackToCourses() {

      currentCourseId = null;
      currentLessonId = null;
      courseDataCache = null;

      document
        .getElementById(
          "course-detail-view"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "lesson-view"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "course-list-view"
        )
        .classList.remove(
          "hidden"
        );

      fetchCourses();

    }


    /* =========================================
       LOADING
       ========================================= */

    function showLoading(isLoading) {

      const loading =
        document.getElementById(
          "loading"
        );

      if (isLoading) {

        loading.classList.remove(
          "hidden"
        );

      } else {

        loading.classList.add(
          "hidden"
        );

      }

    }


    /* =========================================
       ERROR
       ========================================= */

    function showError(message) {

      const error =
        document.getElementById(
          "error"
        );

      error.innerText =
        message ||
        "Something went wrong.";

      error.classList.remove(
        "hidden"
      );

    }


    function hideError() {

      document
        .getElementById(
          "error"
        )
        .classList.add(
          "hidden"
        );

    }


    /* =========================================
       HTML ESCAPING
       ========================================= */

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value === null ||
        value === undefined
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function escapeAttribute(value) {

      return escapeHtml(
        value
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#39;"
      );

    }


    /* =========================================
       START APPLICATION
       ========================================= */

    fetchCourses();

  </script>

</body>
</html>
