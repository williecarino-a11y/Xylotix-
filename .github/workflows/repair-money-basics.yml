name: Repair Money Basics Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair unmatched final delimiter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/learningData/moneyBasics.js')
          text = path.read_text(encoding='utf-8')

          stack = []
          i = 0
          quote = None
          escaped = False
          line_comment = False
          block_comment = False

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''

              if line_comment:
                  if ch == '\n':
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False
                      i += 2
                  else:
                      i += 1
                  continue

              if quote:
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      quote = None
                  i += 1
                  continue

              if ch == '/' and nxt == '/':
                  line_comment = True
                  i += 2
                  continue
              if ch == '/' and nxt == '*':
                  block_comment = True
                  i += 2
                  continue
              if ch in "'\"`":
                  quote = ch
                  i += 1
                  continue

              if ch in '([{':
                  stack.append((ch, i))
              elif ch in ')]}':
                  expected = {')': '(', ']': '[', '}': '{'}[ch]
                  if not stack or stack[-1][0] != expected:
                      print(f'Unmatched closing delimiter {ch} at offset {i}')
                      break
                  stack.pop()
              i += 1

          print('Remaining opening delimiters:', len(stack))
          if stack:
              print(stack[-10:])
          else:
              print('No unmatched opening delimiters.')

          # The CI failure points at the final `};`. If the source is already
          # structurally closed before that terminator, remove that redundant
          # terminator rather than weakening the syntax check.
          stripped = text.rstrip()
          if stripped.endswith('};') and not stack:
              candidate = stripped[:-2].rstrip() + '\n'
              path.write_text(candidate, encoding='utf-8')
              print('Removed redundant final `};`.')
          PY

      - name: Verify syntax
        run: node --check scripts/learningData/moneyBasics.js

      - name: Commit repair
        run: |
          if git diff --quiet -- scripts/learningData/moneyBasics.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/learningData/moneyBasics.js
          git commit -m 'fix: repair money basics JavaScript syntax'
          git push
