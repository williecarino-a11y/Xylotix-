name: Repair Money Basics Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Identify malformed string
        uses: actions/checkout@v4
      - name: Diagnose
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('scripts/learningData/moneyBasics.js').read_text(encoding='utf-8')
          quote = None
          start = None
          escaped = False
          line_comment = block_comment = False
          i = 0
          long_strings = []

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''
              if line_comment:
                  if ch == '\n': line_comment = False
                  i += 1; continue
              if block_comment:
                  if ch == '*' and nxt == '/': block_comment = False; i += 2
                  else: i += 1
                  continue
              if quote:
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      end_line = text.count('\n', 0, i) + 1
                      start_line = text.count('\n', 0, start) + 1
                      if end_line - start_line > 1:
                          long_strings.append((start_line, end_line, start, i, text[start:i+1][:500]))
                      quote = start = None
                  i += 1
                  continue
              if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
              if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
              if ch in "'\"`": quote = ch; start = i; i += 1; continue
              i += 1

          print('Cross-line strings:', len(long_strings))
          for item in long_strings[:20]:
              print(item)
          PY
      - name: Verify syntax
        run: node --check scripts/learningData/moneyBasics.js
