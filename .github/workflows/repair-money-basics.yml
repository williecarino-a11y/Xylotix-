name: Repair Money Basics Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate malformed string
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/learningData/moneyBasics.js')
          text = path.read_text(encoding='utf-8')
          quote = None
          quote_start = None
          escaped = False
          line_comment = False
          block_comment = False
          i = 0

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''

              if line_comment:
                  if ch == '\n': line_comment = False
                  i += 1
                  continue
              if block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False
                      i += 2
                  else:
                      i += 1
                  continue
              if quote:
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      quote = None
                      quote_start = None
                  i += 1
                  continue
              if ch == '/' and nxt == '/':
                  line_comment = True
                  i += 2
                  continue
              if ch == '/' and nxt == '*':
                  block_comment = True
                  i += 2
                  continue
              if ch in "'\"`":
                  quote = ch
                  quote_start = i
                  i += 1
                  continue
              i += 1

          if quote:
              line = text.count('\n', 0, quote_start) + 1
              print(f'Unclosed {quote} string begins at line {line}, offset {quote_start}')
              start = max(0, quote_start - 300)
              end = min(len(text), quote_start + 2500)
              snippet = text[start:end]
              print(snippet)
              print('ASCII apostrophes in affected region:')
              for pos in range(start, end):
                  if text[pos] == "'":
                      print(pos, repr(text[max(start, pos-70):min(end, pos+90)]))
          else:
              print('No unclosed quote detected.')
          PY

      - name: Verify syntax
        run: node --check scripts/learningData/moneyBasics.js

      - name: Stop after diagnosis
        run: exit 1
