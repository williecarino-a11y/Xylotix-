name: Repair Money Basics Syntax

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find suspicious quote lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/learningData/moneyBasics.js').read_text(encoding='utf-8')
          for number, line in enumerate(text.splitlines(), 1):
              count = line.count("'")
              if count > 2:
                  print(f'MULTI_QUOTE line={number} count={count}: {line}')
          PY
      - name: Verify syntax
        run: node --check scripts/learningData/moneyBasics.js
