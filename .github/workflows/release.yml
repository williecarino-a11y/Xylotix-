name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Miimiid
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.TAG_NAME!==expected){console.error('Tag '+process.env.TAG_NAME+' does not match package version '+expected); process.exit(1)}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
