name: Auth Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authentication engine tests
        run: npm test
